<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 5 Mathematics Academy</title><style>body{font:17px system-ui;background:#0b2333;color:#eafaf8;margin:auto;max-width:1000px;padding:20px}a{color:#7ce9d4}section{background:#143849;border:1px solid #4c888d;border-radius:16px;padding:20px;margin:16px 0}button,select,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #75b6b6;margin:5px;max-width:95%}button{background:#78e4cf;color:#092e38;cursor:pointer}input,select{background:#fff;color:#123}#question{font-size:1.5rem}#feedback{min-height:2em}progress{width:100%}</style><a href="discovery-lab.html">← Discovery Lab</a><h1>Grade 5 Mathematics Academy</h1><p>Learn, practise and challenge yourself. All questions run on your device.</p><section><label>Topic <select id="topic"></select></label><label>Difficulty <select id="level"><option value="1">Foundation</option><option value="2">Grade 5</option><option value="3">Challenge</option></select></label><label>Session <select id="length"><option>10</option><option>25</option><option>50</option><option>100</option><option>150</option></select></label><button id="start">Start session</button><h2 id="lessonTitle"></h2><p id="lesson"></p></section><section><p id="progress"></p><progress id="bar" value="0" max="10"></progress><h2 id="question"></h2><form id="form"><label for="answer">Your answer</label><input id="answer" autocomplete="off" required><button>Check answer</button></form><p id="feedback" role="status"></p><button id="next" disabled>Next question</button></section><section><h2>Practice history</h2><div id="history"></div></section><script>
const $=id=>document.getElementById(id),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),g=(q,a,w)=>({q,a,w}),round=(x,n=0)=>Number(x.toFixed(n));
const topics=[
['Place value','Each digit has a value determined by its position. Round by checking the next digit.',d=>{let n=r(1000,99999*d),p=10**r(1,3);return g('Round '+n+' to the nearest '+p,Math.round(n/p)*p,'Divide by '+p+', round to a whole number, then multiply by '+p+'.')}],
['Addition and subtraction','Align place values and regroup when needed.',d=>{let a=r(100,999*d),b=r(10,a),s=r(0,1);return g(a+(s?' + ':' − ')+b,s?a+b:a-b,'Work from the ones column, regrouping as needed.')}],
['Multiplication','Multiply each place value and add partial products.',d=>{let a=r(12,99*d),b=r(2,12*d);return g(a+' × '+b,a*b,'Multiply '+a+' by '+b+' using partial products.')}],
['Division','Division splits a quantity into equal groups.',d=>{let b=r(2,12*d),a=r(10,80*d);return g(a*b+' ÷ '+b,a,'Check by multiplying the quotient by '+b+'.')}],
['Factors and multiples','A factor divides a number exactly; multiples are products.',d=>{let a=r(2,12*d),b=r(2,10);return g('What is the '+b+'th positive multiple of '+a+'?',a*b,'Multiply '+a+' by '+b+'.')}],
['Fractions','The denominator counts equal parts; the numerator counts selected parts.',d=>{let b=r(3,12*d),a=r(1,b-1),c=r(1,b-a);return g(a+'/'+b+' + '+c+'/'+b+' (enter a fraction)',(a+c)/b,'Add numerators: '+(a+c)+'/'+b+'. Equivalent fractions are accepted.')}],
['Decimals','Align decimal points when adding or subtracting.',d=>{let a=r(1,999*d),b=r(1,999*d);return g((a/100).toFixed(2)+' + '+(b/100).toFixed(2),(a+b)/100,'Add hundredths, then divide by 100.')}],
['Percentages','Percent means out of 100.',d=>{let a=r(1,20)*5,b=r(1,10*d)*20;return g(a+'% of '+b,a*b/100,'Multiply by '+a+' and divide by 100.')}],
['Algebra','Use inverse operations to isolate the unknown.',d=>{let a=r(2,12*d),x=r(1,30*d),b=r(1,20);return g(a+'x + '+b+' = '+(a*x+b)+'. Find x.',x,'Subtract '+b+', then divide by '+a+'.')}],
['Patterns','Find the rule connecting consecutive terms.',d=>{let a=r(1,30),b=r(2,10*d);return g([a,a+b,a+2*b,a+3*b].join(', ')+', ?',a+4*b,'Add '+b+' each time.')}],
['Geometry and angles','A right angle is 90°, a straight angle is 180°.',d=>{let a=r(10,170);return g('Two angles form a straight line. One is '+a+'°. Find the other in degrees.',180-a,'Subtract the known angle from 180.')}],
['Metric measurement','1 km = 1000 m; 1 m = 100 cm; 1 kg = 1000 g.',d=>{let a=r(1,50*d),u=r(0,2),v=[['m','cm',100],['km','m',1000],['kg','g',1000]][u];return g('Convert '+a+' '+v[0]+' to '+v[1]+'.',a*v[2],'Multiply by '+v[2]+'.')}],
['Area, perimeter and volume','Area = length × width; perimeter = 2(length + width); volume = length × width × height.',d=>{let a=r(2,15*d),b=r(2,15),c=r(2,8),k=r(0,2);return k===0?g('Area of a '+a+' cm by '+b+' cm rectangle?',a*b,'Multiply length by width.'):k===1?g('Perimeter of a '+a+' cm by '+b+' cm rectangle?',2*(a+b),'Double the sum of length and width.'):g('Volume of a '+a+' × '+b+' × '+c+' cm prism?',a*b*c,'Multiply all three dimensions.')}],
['Transformations and symmetry','Translations slide, reflections flip, rotations turn.',d=>{let a=r(1,10*d),b=r(1,10);return g('A point at ('+a+', 4) slides '+b+' units right. What is its new x-coordinate?',a+b,'Add the horizontal movement to x.')}],
['Coordinate grids','The first coordinate is horizontal; the second is vertical.',d=>{let a=r(1,20*d),b=r(1,20);return g('What is the y-coordinate of ('+a+', '+b+')?',b,'The second coordinate is y.')}],
['Statistics','Mean is the sum divided by the number of values. Range is maximum minus minimum.',d=>{let a=r(1,20*d),b=r(1,10),k=r(0,1);return g((k?'Mean':'Range')+' of '+[a,a+b,a+2*b].join(', '),k?a+b:2*b,k?'Add the three values and divide by 3.':'Subtract the smallest from the largest.')}],
['Probability','Probability = favourable outcomes / total equally likely outcomes.',d=>{let a=r(1,10*d),b=r(1,10*d);return g('A bag has '+a+' red and '+b+' blue balls. Probability of red? Enter a fraction.',a/(a+b),'Red balls divided by total balls.')}],
['Financial literacy','Change = amount paid minus total cost.',d=>{let a=r(1,20*d),b=r(1,99);return g('You pay $'+(a+5)+ ' for an item costing $'+(a+b/100).toFixed(2)+'. Change in dollars?',(500-b)/100,'Subtract the price from the payment.')}],
['Word problems','Identify the quantities, choose operations and check the result.',d=>{let a=r(2,12*d),b=r(2,20),c=r(1,a*b);return g(a+' boxes contain '+b+' pencils each. '+c+' are given away. How many remain?',a*b-c,'Multiply the boxes by pencils per box, then subtract.')}],
['Reasoning challenges','Work backwards and check each step.',d=>{let a=r(1,20*d),b=r(2,9),c=r(1,20);return g('I multiply a number by '+b+' and add '+c+'. The result is '+(a*b+c)+'. What was my number?',a,'Subtract '+c+' and divide by '+b+'.')}]
];$('topic').append(new Option('Mixed review','all'));topics.forEach((t,i)=>$('topic').append(new Option(t[0],i)));let q,n=0,score=0,total=10,done=false,active=false,history=[];try{history=JSON.parse(localStorage.getItem('tc-grade5-math-history')||'[]');if(!Array.isArray(history))history=[]}catch{}function showHistory(){ $('history').textContent=history.length?history.slice(-10).reverse().map(x=>x.topic+': '+x.score+'/'+x.total).join(' • '):'No completed sessions yet.'}function lesson(){let t=topics[Number($('topic').value)];$('lessonTitle').textContent=t?t[0]:'Mixed review';$('lesson').textContent=t?t[1]:'Practise across all 20 modules.'}function next(){let t=$('topic').value==='all'?topics[r(0,topics.length-1)]:topics[Number($('topic').value)];q=t[2](Number($('level').value));done=false;$('question').textContent=q.q;$('progress').textContent='Question '+(n+1)+' of '+total+' · Correct: '+score;$('answer').value='';$('answer').disabled=false;$('feedback').textContent='';$('next').disabled=true;$('bar').value=n;$('answer').focus()}$('start').onclick=()=>{n=score=0;total=Number($('length').value);$('bar').max=total;active=true;lesson();next()};$('topic').onchange=lesson;$('form').onsubmit=e=>{e.preventDefault();if(!active||done)return;let s=$('answer').value.trim(),parts=s.split('/'),a=parts.length===2?Number(parts[0])/Number(parts[1]):Number(s);if(!s||!Number.isFinite(a)){$('feedback').textContent='Enter a number or fraction.';return}done=true;n++;let ok=Math.abs(a-q.a)<1e-8;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Answer: '+round(q.a,8)+'. ')+q.w;$('bar').value=n;$('answer').disabled=true;$('next').disabled=false;$('next').textContent=n===total?'Finish session':'Next question'};$('next').onclick=()=>{if(n<total){next();return}active=false;$('question').textContent='Session complete: '+score+' / '+total;$('next').disabled=true;history.push({topic:$('topic').selectedOptions[0].text,score,total});try{localStorage.setItem('tc-grade5-math-history',JSON.stringify(history.slice(-100)))}catch{}showHistory()};lesson();showHistory();$('start').click();
</script></html>
