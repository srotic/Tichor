name: Deploy TichorConnect V3 staging to Cloudflare Pages
on:
  push:
    branches: [v3-development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tichor-v3-staging-deploy
  cancel-in-progress: true
jobs:
  deploy:
    name: Build, test and deploy V3 staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v3-staging
    steps:
      - name: Check out v3-development
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run staging regression tests
        run: node --test tests/v3-task-isolation.test.cjs tests/v3-staging-build.test.cjs tests/v3-kindergarten-media.test.cjs tests/v3-grade1-math.test.cjs tests/v3-kindergarten-brain-games.test.cjs tests/v3-grade5-brain.test.cjs tests/v3-mcat-cars-highlighter.test.cjs tests/v3-contact-request-onboarding.test.cjs tests/v3-security-hardening.test.cjs tests/v3-e2ee-release-gate.test.cjs tests/v3-chat-missing-tables.test.cjs tests/v3-mobile-chat-menu.test.cjs tests/v3-compose-tools.test.cjs tests/v3-device-link-proof.test.mjs tests/v3-tsa-device-trust.test.mjs tests/v3-tsa-multidevice-envelope.test.mjs tests/v3-tsa-replay-receipts.test.mjs tests/v3-tsa-authenticated-handshake.test.mjs tests/v3-tsa-device-mailbox.test.mjs tests/v3-tsa-active-device-grant.test.mjs
      - name: Validate TSA module syntax
        run: |
          node --check device-link-registry.mjs
          node --check tsa-device-trust.mjs
          node --check tsa-multidevice-envelope.mjs
          node --check tsa-device-readiness.mjs
          node --check tsa-replay-receipts.mjs
          node --check tsa-authenticated-handshake.mjs
          node --check tsa-device-mailbox.mjs
          node --check tsa-active-device-grant.mjs
          node --check e2ee-v3.js
      - name: Build isolated staging site
        run: node scripts/build-v3-staging.cjs
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub's v3-staging environment secrets."
            exit 1
          fi
      - name: Deploy to existing staging Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist/v3-staging --project-name=tichor-v3-staging --branch=main --commit-dirty=true
