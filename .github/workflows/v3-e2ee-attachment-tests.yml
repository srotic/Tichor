name: V3 encrypted attachment and renewal cryptography
on:
  pull_request:
    branches: [v3-development]
    paths:
      - 'e2ee-attachment-crypto.mjs'
      - 'tase-renewal-proof.mjs'
      - 'tests/v3-e2ee-attachment-crypto.test.mjs'
      - 'tests/v3-tase-renewal-*.test.mjs'
      - '.github/workflows/v3-e2ee-attachment-tests.yml'
  workflow_dispatch:
jobs:
  cryptographic-attachment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/v3-e2ee-attachment-crypto.test.mjs tests/v3-tase-renewal-proof.test.mjs tests/v3-tase-renewal-binding.test.mjs
