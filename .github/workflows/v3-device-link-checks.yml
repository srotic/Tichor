name: V3 device linking security checks
on:
  push:
    branches: [feature/v3-device-link-proof]
  pull_request:
    branches: [v3-development]
permissions:
  contents: read
jobs:
  proof-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v3-device-link-proof.test.mjs
      - run: node --check device-link-registry.mjs
