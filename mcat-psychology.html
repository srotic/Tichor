<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCAT Psychology & Sociology Academy</title><style>body{margin:0;background:#081925;color:#e6f6ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}a{color:#83e9d5}section{background:#142d40;border:1px solid #426477;border-radius:16px;padding:20px;margin:16px 0}button,select{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #6fa9ad;background:#214b5c;color:white;cursor:pointer}button:disabled{opacity:.55}#topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}#options button{display:block;width:100%;text-align:left}button.active{outline:2px solid #8affdc}button.eliminated{text-decoration:line-through;opacity:.6}#passage{line-height:1.8;white-space:pre-line}mark{background:#ffdf80;color:#111}#feedback{color:#a4f6d6}#nav{display:flex;flex-wrap:wrap}small{color:#b5d0dc}</style><main><a href="discovery-lab.html">← Discovery Lab</a><h1>MCAT Psychology & Sociology Academy</h1><p>Psychological, Social, and Biological Foundations of Behavior</p><small>Original fictional educational studies · Unofficial MCAT practice · 24 topics · 63 passage questions · 24 independent questions</small><section><button id="practice">Passage practice</button><button id="independent">Independent questions</button><button id="exam">59-question timed practice</button><p id="status"></p><div id="topics"></div></section><section><h2 id="heading"></h2><div id="passage"></div><button id="highlight">Highlight selection</button><button id="flag">Flag question</button><button id="eliminate">Eliminate selected option</button><h3 id="question"></h3><div id="options"></div><p id="feedback" role="status"></p><div id="nav"></div><button id="prev">Previous</button><button id="next">Next</button><button id="submit">Submit session</button><p id="summary"></p></section></main><script src="mcat-ps-bank-01.js"></script><script>
const rows=[["Biological bases of behaviour","A study compares patients with focal hippocampal damage to matched controls. Both groups improve on a mirror-tracing task over five days, but the patients cannot recall meeting the researcher the previous day.","Which memory system is most impaired?","Declarative memory","Procedural memory","Sensory memory","Motor learning","The hippocampus is important for forming new declarative memories; preserved skill learning indicates procedural memory is relatively intact.","Which design is most appropriate for this comparison?","Matched observational comparison","Randomized drug trial","Ethnography","Single-blind placebo trial","Existing lesions are not randomly assigned."],["Sensation and perception","Participants detect a faint tone in 50% of trials at 12 dB. When background noise increases, the intensity required for 50% detection rises to 20 dB.","What does 12 dB represent in the original condition?","Absolute threshold","Difference threshold","Response bias","Sensory adaptation","The absolute threshold is conventionally the intensity detected half the time.","What changed with background noise?","Detection threshold increased","Detection threshold decreased","Stimulus frequency increased","Auditory transduction stopped","The required intensity rose from 12 to 20 dB."],["Learning","A rat presses a lever to terminate an unpleasant sound. Lever pressing increases over repeated trials. In a separate condition, food is delivered after every fifth press.","What explains increased pressing in the first condition?","Negative reinforcement","Positive punishment","Negative punishment","Extinction","Removing an aversive stimulus increases the response.","Which schedule delivers food after every fifth press?","Fixed ratio","Variable ratio","Fixed interval","Variable interval","Reinforcement follows a fixed number of responses."],["Memory","Students learn a list of words and then a second list. Compared with students who rest after the first list, they recall fewer words from the first list. A recognition test yields higher scores than free recall.","What explains poorer recall of the first list?","Retroactive interference","Proactive interference","Primacy effect","State-dependent memory","New learning interferes with retrieval of earlier learning.","Why might recognition outperform free recall?","Recognition supplies retrieval cues","Recognition prevents encoding","Recall measures sensory adaptation","Recall eliminates interference","Recognition provides candidate items that can cue memory."],["Cognition","Participants estimate the frequency of bicycle accidents after reading either a vivid accident story or a neutral article. The vivid-story group gives higher estimates despite receiving identical base-rate information.","Which heuristic best explains the finding?","Availability heuristic","Representativeness heuristic","Anchoring on a numerical estimate","Means-end analysis","Vivid examples are more readily retrieved and may inflate perceived frequency.","Which variable is manipulated?","Article content","Estimated accident frequency","Participant age","Recall accuracy","The assigned article is the independent variable."],["Consciousness","Researchers record EEG during sleep. One stage shows low-amplitude mixed-frequency activity, rapid eye movements and marked skeletal muscle atonia. Participants awakened then frequently report vivid dreams.","Which stage is described?","REM sleep","N1 sleep","N2 sleep","N3 sleep","REM combines rapid eye movements, activated EEG and muscle atonia.","Which feature distinguishes N3 sleep?","High-amplitude slow waves","Rapid eye movements","Persistent muscle atonia","Predominant waking alpha rhythm","N3 is characterized by slow-wave activity."],["Motivation","Children who already enjoy drawing are assigned to expected reward, unexpected reward or no reward conditions. Later, when rewards are absent, the expected-reward group spends less free time drawing.","Which effect is illustrated?","Overjustification effect","Drive reduction","Negative reinforcement","Social facilitation","Expected external rewards can undermine intrinsic motivation in some contexts.","What outcome operationalizes intrinsic interest?","Free-choice drawing time","Reward value","Assignment group","Number of experimenters","Voluntary time drawing is the measured indicator."],["Emotion","Participants receive an arousal-inducing substance and are exposed to either a cheerful or irritated confederate. Those without an explanation for their arousal report emotions more consistent with the social context.","Which theory best predicts this pattern?","Schachter–Singer two-factor theory","James–Lange theory alone","Cannon–Bard theory alone","Drive-reduction theory","Two-factor theory emphasizes physiological arousal and cognitive labeling.","What is a plausible role of the confederate?","Providing contextual cues for labeling arousal","Eliminating physiological arousal","Changing participants' genotype","Measuring long-term memory","The social context helps participants interpret arousal."],["Stress and health","Students facing a demanding exam report stress. Some create study schedules and seek tutoring; others use relaxation exercises to manage distress. Researchers measure salivary cortisol.","Which coping approach is represented by scheduling?","Problem-focused coping","Emotion-focused coping","Avoidant coping","Reaction formation","Scheduling directly addresses the stressor.","Which endocrine pathway culminates in cortisol release?","Hypothalamic–pituitary–adrenal axis","Hypothalamic–pituitary–thyroid axis","Renin–angiotensin system","Sympathetic neuromuscular junction","ACTH stimulates cortisol secretion from the adrenal cortex."],["Human development","A child recognizes that two identical glasses contain equal water. After one is poured into a taller narrower glass, the child insists it contains more. An older child correctly judges the amounts equal.","Which ability is absent in the younger child's response?","Conservation","Object permanence","Habituation","Attachment","Conservation recognizes quantity despite changes in appearance.","Which Piagetian stage is associated with reliable conservation?","Concrete operational","Sensorimotor","Preoperational","Early infancy","Concrete operational thought supports conservation of concrete quantities."],["Personality","Researchers administer a Big Five inventory and observe participants' planning habits. Higher scores on one trait are associated with meeting deadlines and organizing tasks.","Which trait is most relevant?","Conscientiousness","Extraversion","Agreeableness","Openness","Conscientiousness involves organization and self-discipline.","What can a correlational finding establish?","An association between scores and planning","That the trait causes planning","That planning causes the trait","That genetic factors are excluded","Correlation alone does not establish causal direction."],["Psychological disorders","A fictional patient reports intrusive contamination thoughts and repeatedly washes their hands to reduce distress. The rituals consume substantial time and disrupt daily functioning.","Which condition best fits this description?","Obsessive-compulsive disorder","Panic disorder","Specific phobia","Generalized anxiety disorder","Intrusive obsessions and repetitive distress-reducing compulsions characterize OCD.","How can relief after washing maintain the ritual?","Negative reinforcement","Positive punishment","Extinction","Observational learning","Removing distress can reinforce washing."],["Psychological therapies","A therapist helps a client identify automatic negative thoughts, examine evidence for them and practice alternative interpretations. The client also schedules enjoyable activities.","Which approach is most consistent with these methods?","Cognitive behavioural therapy","Classical psychoanalysis","Person-centred therapy alone","Electroconvulsive therapy","CBT combines cognitive restructuring with behavioural techniques.","What is scheduling enjoyable activities an example of?","Behavioural activation","Free association","Dream analysis","Systematic desensitization","Behavioural activation increases engagement in meaningful or rewarding activity."],["Identity and self-concept","Students complete a difficult task. One group receives feedback emphasizing strategies and improvement. Later, this group reports greater confidence in its ability to solve similar tasks.","Which construct is most directly measured by task-specific confidence?","Self-efficacy","Self-esteem","Role conflict","Social identity","Self-efficacy is belief in one's capability to perform a particular task.","Which interpretation is most defensible?","Feedback may affect perceived capability","Feedback proves intelligence increased","Confidence guarantees success","Self-esteem and self-efficacy are identical","Task confidence is not proof of changed ability."],["Social thinking","Observers read about a student who arrived late. Even when told a transit disruption caused the delay, many describe the student as irresponsible.","Which bias is illustrated?","Fundamental attribution error","Self-serving bias","Actor–observer bias as measured across both roles","In-group favoritism","Observers overemphasize disposition relative to situational causes.","Which information is situational?","Transit disruption","Perceived irresponsibility","Personality rating","Trait judgment","Transit conditions are external circumstances."],["Social behaviour","Participants judge line lengths in groups. Confederates unanimously give an incorrect answer. Some participants publicly agree but privately report the correct answer afterward.","Which influence best explains public agreement with private disagreement?","Normative social influence","Informational social influence","Group polarization","Social loafing","Normative influence reflects a desire for acceptance despite private disagreement.","Which change would likely reduce conformity in this paradigm?","Introduce a dissenting group member","Increase unanimity","Make answers public rather than private","Remove all dissent","A dissenting ally breaks unanimity."],["Social interaction","A nurse changes speech and presentation when addressing patients versus colleagues. Separately, competing expectations from work and family create scheduling difficulties.","Which concept describes managing how others perceive oneself?","Impression management","Social stratification","Role exit","Cultural diffusion","Impression management involves presenting oneself differently across interactions.","What describes competing work and family expectations?","Role conflict","Role strain within one role","Status inconsistency","Groupthink","Role conflict arises between distinct social roles."],["Social structure","A researcher examines how schools transmit shared values and prepare people for occupational roles. Another researcher studies how school funding reproduces class inequality.","Which perspective best matches the first researcher?","Structural functionalism","Conflict theory","Symbolic interactionism","Social exchange theory","Functionalism examines contributions of institutions to social stability.","Which perspective best matches the second researcher?","Conflict theory","Structural functionalism","Rational choice alone","Dramaturgy","Conflict theory emphasizes unequal resources and power."],["Culture and socialization","New employees learn informal workplace expectations through observing colleagues. A newcomer adopts local practices while retaining important elements of their original culture.","What process describes learning workplace expectations?","Socialization","Social mobility","Demographic transition","Medicalization","Socialization transmits norms and expected behaviours.","What term best describes adapting to another culture while retaining original cultural elements?","Acculturation","Complete assimilation","Social isolation","Cultural extinction","Acculturation can occur without abandoning original cultural identity."],["Demographics","A region experiences declining mortality followed decades later by declining fertility. During the interval, population growth accelerates.","Which framework describes this sequence?","Demographic transition","Social exchange theory","Labeling theory","Cultural lag alone","Demographic transition describes shifts in mortality and fertility with development.","Why does growth accelerate during the interval?","Birth rates exceed death rates","Death rates exceed birth rates","Fertility becomes zero","Migration must be negative","Falling mortality while fertility remains high increases natural growth."],["Social inequality","A study finds that children from high-income families have greater access to tutoring and professional networks. These advantages predict later educational opportunities.","Which concept describes useful resources embedded in social networks?","Social capital","Human capital alone","Role strain","Social disorganization","Social capital refers to resources available through social connections.","What is movement between socioeconomic positions across generations called?","Intergenerational mobility","Horizontal role conflict","Cultural diffusion","Intragenerational mobility","Intergenerational mobility compares social positions across generations."],["Health disparities","Two neighborhoods differ in access to grocery stores, transit and primary care. Residents of the less-resourced neighborhood have higher rates of uncontrolled diabetes in a cross-sectional survey.","Which framework best addresses these environmental differences?","Social determinants of health","Biological determinism","Classical conditioning","Trait theory","Social determinants include conditions shaping access to resources and health.","Which conclusion is warranted?","Neighborhood resources and diabetes control are associated","Neighborhood resources alone cause every case","Individual behaviour has no role","The survey establishes temporal order","Cross-sectional associations cannot establish temporal order or causality."],["Research methods","Researchers randomly assign volunteers to an intervention or control condition. Outcome assessors know assignments. The intervention group improves more on a subjective rating scale.","Which threat is particularly relevant?","Observer expectancy bias","Random sampling error alone","Reverse causation from assignment","Ecological fallacy","Unblinded assessors may rate outcomes differently based on expectations.","Which modification directly addresses this threat?","Blind outcome assessors","Increase intervention dose","Remove the control group","Recruit only high scorers","Blinding reduces assessor expectancy effects."],["Statistics and data interpretation","A cohort study finds an outcome in 30 of 100 exposed participants and 10 of 100 unexposed participants. Exposure is not randomly assigned.","What is the risk ratio?","3","2","0.3","20","Risk ratio = 0.30 / 0.10 = 3.","What is the absolute risk difference?","20 percentage points","3 percentage points","30 percentage points","10 percentage points","Subtract 10% from 30%."]],$=id=>document.getElementById(id),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sets=rows.map((r,i)=>({topic:r[0],passage:r[1],qs:[2,8].map((j,k)=>({id:i+'p'+k,t:r[j],a:r[j+1],opts:shuffle(r.slice(j+1,j+5)),e:r[j+5]}))}));const discrete=[["Which structure coordinates balance?","Cerebellum","Amygdala","Thalamus","Hippocampus"],["Which receptors support dim-light vision?","Rods","Cones","Bipolar cells","Ganglion cells"],["Removing a privilege to decrease behavior is what?","Negative punishment","Positive punishment","Negative reinforcement","Positive reinforcement"],["Memory for riding a bicycle is primarily what?","Procedural","Semantic","Episodic","Iconic"],["Seeking evidence supporting existing beliefs is what?","Confirmation bias","Availability heuristic","Functional fixedness","Hindsight bias"],["Which hormone regulates circadian sleep timing?","Melatonin","Insulin","Aldosterone","Glucagon"],["Which theory emphasizes restoring homeostasis?","Drive reduction","Incentive theory","Self-perception theory","Expectancy-value theory"],["Which theory proposes simultaneous emotion and arousal?","Cannon–Bard","James–Lange","Schachter–Singer","Drive reduction"],["Which division mobilizes fight-or-flight responses?","Sympathetic","Parasympathetic","Somatic sensory","Enteric"],["Searching for a hidden toy demonstrates what?","Object permanence","Conservation","Abstract reasoning","Egocentrism"],["Which Big Five trait reflects curiosity?","Openness","Agreeableness","Neuroticism","Conscientiousness"],["Which is a negative symptom of schizophrenia?","Reduced emotional expression","Hallucinations","Delusions","Disorganized speech"],["Graded exposure paired with relaxation is what?","Systematic desensitization","Free association","Aversion conditioning","Cognitive restructuring"],["Evaluating oneself relative to peers is what?","Social comparison","Role exit","Self-handicapping","Deindividuation"],["Attributing success internally and failure externally is what?","Self-serving bias","Fundamental attribution error","Just-world belief","False consensus"],["Reduced effort in collective tasks is what?","Social loafing","Group polarization","Social facilitation","Obedience"],["Competing demands within one social role are what?","Role strain","Role conflict","Role exit","Status mobility"],["Which perspective emphasizes meaning in everyday interactions?","Symbolic interactionism","Functionalism","Conflict theory","Demographic transition"],["Judging other cultures by one's own cultural standards is what?","Ethnocentrism","Cultural relativism","Acculturation","Diffusion"],["Live births per 1,000 population per year is what?","Crude birth rate","Total fertility rate","Infant mortality rate","Population density"],["Institutionally valued knowledge and dispositions are what?","Cultural capital","Social capital","Financial capital","Role strain"],["Inability to afford transit to a clinic illustrates what?","Economic access barrier","Diagnostic unreliability","Genetic susceptibility","Observer bias"],["A scale consistently reads too high. What does it exhibit?","Reliability without accuracy","Accuracy without reliability","External validity","Random assignment"],["A correlation of −0.80 indicates what?","Strong negative linear association","Weak negative linear association","Strong positive linear association","Proof of causation"]].map((r,i)=>({id:i+'d',t:r[0],a:r[1],opts:shuffle(r.slice(1,5)),e:'The best answer is '+r[1]+'.',topic:sets[i].topic,passage:''}));const extended=(window.TICHOR_PS_BANK_01||[]).map((s,i)=>({topic:s.topic,passage:s.passage,qs:s.qs.map((r,j)=>({id:"ext"+i+"p"+j,t:r[0],a:r[1],opts:shuffle(r.slice(1,5)),e:r[5]}))}));sets.push(...extended);let session=[],pos=0,answers={},flags={},eliminated={},done=false,mode='passage',timer=null,deadline=0,mastery={};try{mastery=JSON.parse(localStorage.getItem('tc-ps-mastery')||'{}')}catch{}
function start(qs,m){clearInterval(timer);session=qs;mode=m;pos=0;answers={};flags={};eliminated={};done=false;$('summary').textContent='';if(m==='exam'){deadline=Date.now()+95*60000;timer=setInterval(()=>{let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('status').textContent='Timed practice · '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)finish()},250)}else $('status').textContent=m==='passage'?'Passage practice':'Independent practice';render()}
function group(s){return s.qs.map(q=>({...q,topic:s.topic,passage:s.passage}))}
function render(){let q=session[pos];if(!q)return;$('heading').textContent=q.topic+' · '+(pos+1)+' / '+session.length;$('passage').textContent=q.passage;$('question').textContent=q.t;$('feedback').textContent=done?(answers[q.id]===q.a?'Correct. ':'Answer: '+q.a+'. ')+q.e:'';$('flag').textContent=flags[q.id]?'Flagged':'Flag question';$('options').replaceChildren();q.opts.forEach((o,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+o;b.className=(answers[q.id]===o?'active ':'')+(eliminated[q.id]?.includes(o)?'eliminated':'');if(done&&o===q.a)b.style.borderColor='#91ffbb';b.disabled=done;b.onclick=()=>{answers[q.id]=o;render()};$('options').append(b)});$('nav').replaceChildren();session.forEach((x,i)=>{let b=document.createElement('button');b.textContent=(i+1)+(flags[x.id]?' ⚑':answers[x.id]?' ✓':'');b.className=i===pos?'active':'';b.onclick=()=>{pos=i;render()};$('nav').append(b)});$('prev').disabled=pos===0;$('next').disabled=pos===session.length-1;$('submit').disabled=done}
function finish(){if(done)return;done=true;clearInterval(timer);let n=0;session.forEach(q=>{let ok=answers[q.id]===q.a;n+=Number(ok);let s=mastery[q.topic]||{n:0,c:0};s.n++;s.c+=Number(ok);mastery[q.topic]=s});try{localStorage.setItem('tc-ps-mastery',JSON.stringify(mastery))}catch{}$('summary').textContent='Score: '+n+'/'+session.length+' ('+Math.round(n/session.length*100)+'%). Review each question for explanations. Topic accuracy: '+Object.entries(mastery).map(([k,v])=>k+' '+Math.round(v.c/v.n*100)+'%').join(' · ');render()}
sets.forEach(s=>{let b=document.createElement('button');b.textContent=s.topic+(extended.includes(s)?' — extended study':'');b.onclick=()=>start(group(s),'passage');$('topics').append(b)});$('practice').onclick=()=>start(group(sets[0]),'passage');$('independent').onclick=()=>start(shuffle(discrete.slice()),'independent');$('exam').onclick=()=>start([...shuffle(sets.filter(s=>!extended.includes(s))).slice(0,22).flatMap(group),...shuffle(discrete.slice()).slice(0,15)],'exam');$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<session.length-1){pos++;render()}};$('submit').onclick=finish;$('flag').onclick=()=>{let q=session[pos];flags[q.id]=!flags[q.id];render()};$('eliminate').onclick=()=>{let q=session[pos],v=answers[q.id];if(done||!v)return;let a=eliminated[q.id]||[];eliminated[q.id]=a.includes(v)?a.filter(x=>x!==v):[...a,v];delete answers[q.id];render()};$('highlight').onclick=()=>{let s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;let r=s.getRangeAt(0);if(!$('passage').contains(r.commonAncestorContainer))return;try{r.surroundContents(document.createElement('mark'));s.removeAllRanges()}catch{}};start(group(sets[0]),'passage');
</script></html>
