<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tichor MCAT Simulation Arena</title><style>
*{box-sizing:border-box}body{margin:0;color:#e8faff;background:radial-gradient(ellipse at top,#19475b,#071522 65%);font:16px system-ui}main{max-width:1150px;margin:auto;padding:24px}a{color:#8cf4dc}h1{font-size:clamp(28px,4vw,48px);text-shadow:0 4px #164c5d}section{background:linear-gradient(145deg,#163c50,#0e2638);border:1px solid #477f8e;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 10px 30px #0005}button,select,input{font:inherit;padding:10px;border-radius:9px;margin:4px}button{background:linear-gradient(#286778,#153747);border:1px solid #75c9c3;color:white;cursor:pointer}button:focus-visible{outline:3px solid gold}button:disabled{opacity:.7}select,input{color:#123;background:#eaffff}#modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}#modules button{text-align:left;min-height:60px}#modules button[aria-pressed=true]{border:2px solid #91ffdf;background:#205e62}#controls{display:flex;flex-wrap:wrap;gap:12px}#controls label{flex:1;min-width:160px}#controls input[type=range]{width:95%}canvas{width:100%;max-width:780px;background:#091e2c;border-radius:12px}#result{font-size:24px;color:#92f4db}#choices{display:grid;gap:8px}#choices button{text-align:left}#feedback{min-height:40px;color:#ffdf91}#passage{white-space:pre-line;line-height:1.65}mark{background:#ffe081;color:#17212a}small{color:#b9d6df}</style><main><a href="discovery-lab.html">← Discovery Lab</a><h1>MCAT Simulation Arena</h1><p>Virtual experiments · Scientific reasoning · Original MCAT-style challenges</p><small>Educational models with idealized assumptions, not clinical or laboratory protocols. Not affiliated with AAMC.</small><p id="stats"></p><section><div id="modules"></div></section><section><h2 id="title"></h2><p id="description"></p><div id="controls"></div><canvas id="plot" width="780" height="360" aria-label="Experimental data visualization"></canvas><p id="result" aria-live="polite"></p><button id="challenge">New research challenge</button></section><section><h2>Research challenge</h2><p id="passage"></p><p id="question"></p><div id="choices"></div><p id="feedback" role="status"></p><button id="highlight">Highlight selected passage text</button><button id="clearHighlight">Clear highlights</button></section></main><script>
const $=id=>document.getElementById(id),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),round=x=>Number(x.toFixed(3)),fmt=x=>String(round(x)),Q=(p,t,a,w,e)=>({p,t,a,w,e}),slider=(n,min,max,step,v)=>({n,min,max,step,v}),select=(n,options,v)=>({n,options,v}),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mods=[
{n:'Enzyme kinetics',d:'Michaelis–Menten kinetics; ideal competitive and pure noncompetitive inhibition.',c:[slider('Km (mM)',1,10,.5,3),slider('Vmax (µmol/min)',20,150,5,100),slider('Substrate (mM)',0,20,.5,5),select('Inhibitor',['None','Competitive','Noncompetitive'],'None')],calc:([k,v,s,i])=>{let K=k*(i==='Competitive'?2:1),V=v*(i==='Noncompetitive'?.5:1);return {text:'Velocity '+fmt(V*s/(K+s))+' µmol/min · apparent Km '+K+' · Vmax '+V,curves:[{name:'Control',f:x=>v*x/(k+x)},{name:'Experiment',f:x=>V*x/(K+x)}],max:20,ymax:150,x:'Substrate (mM)',y:'Velocity (µmol/min)'}},q:()=>{let k=r(2,8),v=r(4,12)*10;return Q('A purified enzyme has Km '+k+' mM and Vmax '+v+' µmol/min. After adding inhibitor X, apparent Km doubles but Vmax is unchanged.','Which model best fits the observations?','Competitive inhibition',['Pure noncompetitive inhibition','Uncompetitive inhibition','Irreversible loss of active enzyme'],'Competitive inhibition increases apparent Km without changing Vmax.')}},
{n:'Acid–base buffer',d:'Ideal Henderson–Hasselbalch model for a weak acid and conjugate base.',c:[slider('pKa',3,10,.1,4.8),slider('Base concentration (mM)',1,100,1,20),slider('Acid concentration (mM)',1,100,1,20)],calc:([p,b,a])=>({text:'pH = '+fmt(p+Math.log10(b/a)),curves:[{name:'Buffer',f:x=>p+Math.log10(Math.max(1,x)/a)}],max:100,ymax:14,x:'Base (mM)',y:'pH'}),q:()=>{let p=r(4,8);return Q('A buffer has pKa '+p+' and a conjugate base-to-acid ratio of 10.','What is its approximate pH?',String(p+1),[String(p-1),String(p),String(p+2)],'pH = pKa + log10(10) = '+(p+1)+'.')}},
{n:'Circuit engineering',d:'Ideal DC source and two resistors in series or parallel.',c:[slider('Voltage (V)',1,24,1,12),slider('R1 (Ω)',1,20,1,6),slider('R2 (Ω)',1,20,1,6),select('Topology',['Series','Parallel'],'Series')],calc:([v,a,b,t])=>{let R=t==='Series'?a+b:a*b/(a+b);return {text:'Equivalent resistance '+fmt(R)+' Ω · Current '+fmt(v/R)+' A · Power '+fmt(v*v/R)+' W',curves:[{name:'Current',f:x=>x/R}],max:24,ymax:Math.max(1,24/R),x:'Voltage (V)',y:'Current (A)'}},q:()=>{let a=r(2,9)*2;return Q('Two identical '+a+' Ω resistors are connected in parallel to an ideal battery.','What is equivalent resistance?',a/2+' Ω',[a+' Ω',a*2+' Ω',a*4+' Ω'],'Two equal resistors in parallel have half the individual resistance.')}},
{n:'Fluid dynamics',d:'Steady incompressible flow through a horizontal ideal pipe; continuity and Bernoulli.',c:[slider('Inlet radius (cm)',1,5,.5,3),slider('Outlet radius (cm)',1,5,.5,2),slider('Inlet speed (m/s)',.5,4,.5,1)],calc:([a,b,v])=>{let u=v*a*a/(b*b);return {text:'Outlet speed '+fmt(u)+' m/s · Pout − Pin '+fmt(500*(v*v-u*u))+' Pa (water)',curves:[{name:'Outlet speed',f:x=>v*a*a/Math.max(1,x)**2}],max:5,ymax:Math.max(1,v*a*a),x:'Outlet radius (cm; ≥1)',y:'Speed (m/s)'}},q:()=>Q('A horizontal pipe narrows to half its original radius. Assume steady incompressible inviscid flow.','How does fluid speed change?','Quadruples',['Doubles','Halves','Remains constant'],'Area is proportional to radius squared; continuity requires A₁v₁=A₂v₂.')},
{n:'Optics laboratory',d:'Thin converging lens with real object beyond focal length.',c:[slider('Focal length (cm)',5,15,1,10),slider('Object distance (cm)',16,60,1,30)],calc:([f,o])=>{let i=f*o/(o-f);return {text:'Image distance '+fmt(i)+' cm · Magnification '+fmt(-i/o),curves:[{name:'Image distance',f:x=>x>f?Math.min(250,f*x/(x-f)):NaN}],max:60,ymax:250,x:'Object distance (cm)',y:'Image distance (cm)'}},q:()=>{let f=r(5,15);return Q('An object is placed '+2*f+' cm from a converging lens of focal length '+f+' cm.','Where is the real image?',2*f+' cm from lens',[f+' cm from lens',3*f+' cm from lens',4*f+' cm from lens'],'At twice focal length, the real image forms at twice focal length.')}},
{n:'PCR amplification',d:'Idealized exponential amplification with constant efficiency; ignores plateau effects.',c:[slider('Starting copies',1,100,1,10),slider('Cycles',0,25,1,15),slider('Efficiency (%)',50,100,5,100)],calc:([n,c,e])=>({text:'Predicted copies ≈ '+Math.round(n*(1+e/100)**c).toLocaleString(),curves:[{name:'log10 copies',f:x=>Math.log10(n*(1+e/100)**x)}],max:25,ymax:10,x:'Cycle',y:'log10 copies'}),q:()=>{let n=r(2,8);return Q('An ideal PCR begins with '+n+' double-stranded DNA molecules. Each cycle doubles the number.','How many molecules after 4 cycles?',String(n*16),[String(n*4),String(n*8),String(n*32)],'Multiply initial copies by 2⁴.')}},
{n:'Gel electrophoresis',d:'Illustrative inverse relationship between migration and log fragment length; not calibrated experimental data.',c:[slider('Fragment length (bp)',100,2000,100,500),slider('Run time (relative)',1,10,1,5)],calc:([b,t])=>({text:'Relative migration '+fmt(t*(4-Math.log10(b))),curves:[{name:'Migration',f:x=>t*(4-Math.log10(Math.max(100,x)))}],max:2000,ymax:20,x:'Fragment length (bp)',y:'Relative migration'}),q:()=>Q('Linear DNA fragments of 200 bp and 1000 bp are separated on an agarose gel under the same conditions.','Which fragment generally migrates farther?','200 bp fragment',['1000 bp fragment','Both migrate equally','Neither migrates'],'Smaller linear DNA fragments generally move more easily through agarose.')},
{n:'Spectrophotometry',d:'Beer–Lambert law under ideal dilute-solution conditions.',c:[slider('Extinction coefficient (L/mol/cm)',100,1000,50,500),slider('Concentration (mM)',0,2,.1,1),slider('Path length (cm)',.5,2,.5,1)],calc:([e,c,l])=>({text:'Absorbance '+fmt(e*c*l/1000),curves:[{name:'Absorbance',f:x=>e*x*l/1000}],max:2,ymax:4,x:'Concentration (mM)',y:'Absorbance'}),q:()=>Q('A dilute solution follows Beer–Lambert law. Concentration doubles while path length and extinction coefficient remain constant.','What happens to absorbance?','Doubles',['Halves','Quadruples','Unchanged'],'Absorbance is directly proportional to concentration.')},
{n:'Cardiovascular physiology',d:'Cardiac output model; not a clinical prediction.',c:[slider('Heart rate (beats/min)',40,160,5,70),slider('Stroke volume (mL)',30,120,5,70)],calc:([h,s])=>({text:'Cardiac output '+fmt(h*s/1000)+' L/min',curves:[{name:'Output',f:x=>x*s/1000}],max:160,ymax:20,x:'Heart rate',y:'Output (L/min)'}),q:()=>Q('Heart rate is 80 beats/min and stroke volume is 75 mL/beat.','What is cardiac output?','6 L/min',['0.6 L/min','60 L/min','8 L/min'],'80 × 75 = 6000 mL/min = 6 L/min.')},
{n:'Membrane potential',d:'Nernst equation for potassium at 37 °C; single-ion equilibrium model.',c:[slider('Extracellular K⁺ (mM)',2,20,1,4),slider('Intracellular K⁺ (mM)',100,160,5,140)],calc:([o,i])=>({text:'K⁺ equilibrium potential '+fmt(61.5*Math.log10(o/i))+' mV',curves:[{name:'E(K)',f:x=>61.5*Math.log10(Math.max(2,x)/i)}],max:20,ymax:0,ymin:-130,x:'Extracellular K⁺ (mM)',y:'Potential (mV)'}),q:()=>Q('Extracellular potassium increases while intracellular potassium remains constant.','How does the potassium equilibrium potential change?','Becomes less negative',['Becomes more negative','Remains unchanged','Must become exactly zero'],'The extracellular-to-intracellular concentration ratio increases, making E(K) less negative.')},
{n:'Genetics and inheritance',d:'Single-gene autosomal recessive inheritance with independent segregation.',c:[select('Parent 1',['AA','Aa','aa'],'Aa'),select('Parent 2',['AA','Aa','aa'],'Aa')],calc:([a,b])=>{let p=(a.split('').filter(x=>x==='a').length/2)*(b.split('').filter(x=>x==='a').length/2);return {text:'Probability of aa offspring: '+p*100+'%',bars:[['aa',p*100],['Not aa',(1-p)*100]],ymax:100,y:'Probability (%)'}},q:()=>Q('Two heterozygous carriers of an autosomal recessive trait have a child. Assume complete penetrance.','Probability the child expresses the recessive trait?','25%',['0%','50%','75%'],'Aa × Aa yields AA, Aa, Aa, aa with equal probability.')},
{n:'Research design',d:'Explore sampling variability in an ideal independent Bernoulli experiment.',c:[slider('Sample size',10,500,10,100),slider('True proportion (%)',10,90,5,50)],calc:([n,p])=>({text:'Standard error ≈ '+fmt(Math.sqrt(p/100*(1-p/100)/n)),curves:[{name:'Standard error',f:x=>Math.sqrt(p/100*(1-p/100)/Math.max(10,x))}],max:500,ymax:.2,x:'Sample size',y:'Standard error'}),q:()=>Q('A study randomly assigns participants to treatment and placebo groups. Investigators and participants are unaware of assignments.','Which design feature most directly reduces expectation-related measurement bias?','Double blinding',['Larger sample size','Convenience sampling','Increasing treatment dose'],'Blinding reduces expectation effects in participants and investigators.')},
{n:'Psychology: conditioning',d:'Illustrative acquisition model, not an empirically fitted learning curve.',c:[slider('Learning rate',.05,.5,.05,.2),slider('Trials',1,30,1,10)],calc:([a,n])=>({text:'Illustrative association strength '+fmt(1-(1-a)**n),curves:[{name:'Acquisition',f:x=>1-(1-a)**x}],max:30,ymax:1,x:'Trials',y:'Association strength'}),q:()=>Q('A tone is repeatedly paired with food until the tone alone elicits salivation.','What is the tone after conditioning?','Conditioned stimulus',['Unconditioned stimulus','Unconditioned response','Conditioned response'],'A previously neutral stimulus becomes a conditioned stimulus after pairing.')},
{n:'CARS reasoning',d:'Original passage-based critical reasoning. Use highlighting to identify evidence.',c:[],calc:()=>({text:'Read the passage and evaluate the argument.',bars:[],ymax:1}),q:()=>Q('A city museum recently eliminated admission fees. Attendance increased, but the director cautions that attendance alone cannot establish whether access has become more equitable. Visitors who previously attended once a year may now visit monthly, while residents facing transportation barriers may still be absent. The director argues that evaluation must distinguish frequency of visits from the diversity of people served.','Which finding most directly supports the director’s concern?','Most additional visits came from existing visitors',['Museum operating costs declined','The museum added a new exhibition','Visitors rated exhibits more favourably'],'Repeat visits can raise attendance without broadening access, which is the distinction the director emphasizes.')}
,
{n:"Glycolysis",d:"Under standard glycolysis accounting, each glucose yields two net ATP.",c:[slider("Glucose molecules",1,20,1,5)],calc:([v])=>{let fn=x=>x*2;return {text:"Net ATP: "+fmt(fn(v)),curves:[{name:"Net ATP",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"Glucose molecules",y:"Net ATP"}},q:()=>Q("Under standard glycolysis accounting, each glucose yields two net ATP.","How many net ATP are produced per glucose?","2",["4","6","8"],"Key concept: 2. Under standard glycolysis accounting, each glucose yields two net ATP.")},
{n:"Citric acid cycle",d:"Each acetyl-CoA oxidized in the cycle yields three NADH.",c:[slider("Acetyl-CoA molecules",1,20,1,5)],calc:([v])=>{let fn=x=>x*3;return {text:"NADH: "+fmt(fn(v)),curves:[{name:"NADH",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"Acetyl-CoA molecules",y:"NADH"}},q:()=>Q("Each acetyl-CoA oxidized in the cycle yields three NADH.","How many NADH are produced per acetyl-CoA?","3",["1","2","4"],"Key concept: 3. Each acetyl-CoA oxidized in the cycle yields three NADH.")},
{n:"Beta oxidation",d:"Complete beta oxidation of palmitate yields eight acetyl-CoA per molecule.",c:[slider("Palmitate molecules",1,20,1,5)],calc:([v])=>{let fn=x=>x*8;return {text:"Acetyl-CoA: "+fmt(fn(v)),curves:[{name:"Acetyl-CoA",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"Palmitate molecules",y:"Acetyl-CoA"}},q:()=>Q("Complete beta oxidation of palmitate yields eight acetyl-CoA per molecule.","How many beta oxidation cycles are required for palmitate?","7",["8","6","16"],"Key concept: 7. Complete beta oxidation of palmitate yields eight acetyl-CoA per molecule.")},
{n:"Oxidative phosphorylation",d:"Using an approximate P/O ratio of 2.5 ATP per mitochondrial NADH.",c:[slider("NADH molecules",1,20,1,5)],calc:([v])=>{let fn=x=>x*2.5;return {text:"Approximate ATP: "+fmt(fn(v)),curves:[{name:"Approximate ATP",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"NADH molecules",y:"Approximate ATP"}},q:()=>Q("Using an approximate P/O ratio of 2.5 ATP per mitochondrial NADH.","Which complex directly synthesizes ATP?","ATP synthase",["Complex I","Complex II","Complex IV"],"Key concept: ATP synthase. Using an approximate P/O ratio of 2.5 ATP per mitochondrial NADH.")},
{n:"Translation",d:"A linear peptide of n residues contains n−1 peptide bonds.",c:[slider("Amino acids in linear peptide",2,100,1,20)],calc:([v])=>{let fn=x=>x-1;return {text:"Peptide bonds: "+fmt(fn(v)),curves:[{name:"Peptide bonds",f:x=>x<2?NaN:fn(x)}],max:100,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(2+(100-2)*i/100)))*1.1,x:"Amino acids in linear peptide",y:"Peptide bonds"}},q:()=>Q("A linear peptide of n residues contains n−1 peptide bonds.","What links adjacent amino acids in a polypeptide?","Peptide bond",["Phosphodiester bond","Glycosidic bond","Hydrogen bond"],"Key concept: Peptide bond. A linear peptide of n residues contains n−1 peptide bonds.")},
{n:"DNA replication",d:"Ideal complete semiconservative replication doubles molecule count.",c:[slider("Double-stranded DNA molecules",1,20,1,5)],calc:([v])=>{let fn=x=>x*2;return {text:"Daughter molecules after one round: "+fmt(fn(v)),curves:[{name:"Daughter molecules after one round",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"Double-stranded DNA molecules",y:"Daughter molecules after one round"}},q:()=>Q("Ideal complete semiconservative replication doubles molecule count.","Which enzyme synthesizes DNA from a DNA template?","DNA polymerase",["RNA polymerase","Ligase","Helicase"],"Key concept: DNA polymerase. Ideal complete semiconservative replication doubles molecule count.")},
{n:"Renal filtration",d:"Daily filtrate equals GFR × 1440 minutes divided by 1000.",c:[slider("GFR (mL/min)",60,150,5,120)],calc:([v])=>{let fn=x=>x*1.44;return {text:"Filtrate (L/day): "+fmt(fn(v)),curves:[{name:"Filtrate (L/day)",f:x=>x<60?NaN:fn(x)}],max:150,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(60+(150-60)*i/100)))*1.1,x:"GFR (mL/min)",y:"Filtrate (L/day)"}},q:()=>Q("Daily filtrate equals GFR × 1440 minutes divided by 1000.","Which structure normally filters plasma into Bowman’s space?","Glomerulus",["Collecting duct","Loop of Henle","Distal tubule"],"Key concept: Glomerulus. Daily filtrate equals GFR × 1440 minutes divided by 1000.")},
{n:"Respiratory physiology",d:"Assume dead space 150 mL and respiratory rate 12/min.",c:[slider("Tidal volume (mL)",300,800,25,500)],calc:([v])=>{let fn=x=>(x-150)*12/1000;return {text:"Alveolar ventilation (L/min): "+fmt(fn(v)),curves:[{name:"Alveolar ventilation (L/min)",f:x=>x<300?NaN:fn(x)}],max:800,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(300+(800-300)*i/100)))*1.1,x:"Tidal volume (mL)",y:"Alveolar ventilation (L/min)"}},q:()=>Q("Assume dead space 150 mL and respiratory rate 12/min.","Which change increases alveolar ventilation at constant respiratory rate?","Increased tidal volume",["Increased dead space","Reduced tidal volume","Reduced inspired oxygen fraction alone"],"Key concept: Increased tidal volume. Assume dead space 150 mL and respiratory rate 12/min.")},
{n:"Osmosis",d:"Ideal nondissociating solute at 310 K; π = CRT.",c:[slider("Solute concentration (mM)",10,300,10,100)],calc:([v])=>{let fn=x=>x*2.577;return {text:"Ideal osmotic pressure (kPa): "+fmt(fn(v)),curves:[{name:"Ideal osmotic pressure (kPa)",f:x=>x<10?NaN:fn(x)}],max:300,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(10+(300-10)*i/100)))*1.1,x:"Solute concentration (mM)",y:"Ideal osmotic pressure (kPa)"}},q:()=>Q("Ideal nondissociating solute at 310 K; π = CRT.","Water moves across a selectively permeable membrane toward which side?","Higher effective solute concentration",["Lower effective solute concentration","Higher water activity","Lower osmotic pressure"],"Key concept: Higher effective solute concentration. Ideal nondissociating solute at 310 K; π = CRT.")},
{n:"Gas laws",d:"Fixed volume and amount; pressure is 100 kPa at 300 K.",c:[slider("Temperature (K)",200,400,10,300)],calc:([v])=>{let fn=x=>x/3;return {text:"Pressure (kPa): "+fmt(fn(v)),curves:[{name:"Pressure (kPa)",f:x=>x<200?NaN:fn(x)}],max:400,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(200+(400-200)*i/100)))*1.1,x:"Temperature (K)",y:"Pressure (kPa)"}},q:()=>Q("Fixed volume and amount; pressure is 100 kPa at 300 K.","At constant volume, doubling absolute temperature does what to pressure?","Doubles it",["Halves it","Quadruples it","Leaves it unchanged"],"Key concept: Doubles it. Fixed volume and amount; pressure is 100 kPa at 300 K.")},
{n:"Electrostatics",d:"Fixed point charges; normalized force at 1 cm is 1.",c:[slider("Separation (cm)",1,20,1,5)],calc:([v])=>{let fn=x=>1/x**2;return {text:"Relative force: "+fmt(fn(v)),curves:[{name:"Relative force",f:x=>x<1?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(1+(20-1)*i/100)))*1.1,x:"Separation (cm)",y:"Relative force"}},q:()=>Q("Fixed point charges; normalized force at 1 cm is 1.","Doubling separation changes Coulomb force magnitude by what factor?","1/4",["1/2","2","4"],"Key concept: 1/4. Fixed point charges; normalized force at 1 cm is 1.")},
{n:"Kinematics",d:"Object starts at rest with constant acceleration 2 m/s².",c:[slider("Time (s)",0,20,1,5)],calc:([v])=>{let fn=x=>x*x;return {text:"Distance (m): "+fmt(fn(v)),curves:[{name:"Distance (m)",f:x=>x<0?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(0+(20-0)*i/100)))*1.1,x:"Time (s)",y:"Distance (m)"}},q:()=>Q("Object starts at rest with constant acceleration 2 m/s².","For constant nonzero acceleration from rest, displacement is proportional to what?","Time squared",["Time","Inverse time","Square root of time"],"Key concept: Time squared. Object starts at rest with constant acceleration 2 m/s².")},
{n:"Work and energy",d:"Assume 10 kg mass and g = 9.8 m/s².",c:[slider("Height (m)",0,20,1,5)],calc:([v])=>{let fn=x=>x*98;return {text:"Potential energy (J): "+fmt(fn(v)),curves:[{name:"Potential energy (J)",f:x=>x<0?NaN:fn(x)}],max:20,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(0+(20-0)*i/100)))*1.1,x:"Height (m)",y:"Potential energy (J)"}},q:()=>Q("Assume 10 kg mass and g = 9.8 m/s².","Which quantity is conserved in an isolated frictionless mechanical system?","Total mechanical energy",["Kinetic energy alone","Potential energy alone","Speed"],"Key concept: Total mechanical energy. Assume 10 kg mass and g = 9.8 m/s².")},
{n:"Waves",d:"Assume sound speed 340 m/s.",c:[slider("Frequency (Hz)",100,1000,50,500)],calc:([v])=>{let fn=x=>340/x;return {text:"Wavelength (m): "+fmt(fn(v)),curves:[{name:"Wavelength (m)",f:x=>x<100?NaN:fn(x)}],max:1000,ymax:Math.max(1,...Array.from({length:101},(_,i)=>fn(100+(1000-100)*i/100)))*1.1,x:"Frequency (Hz)",y:"Wavelength (m)"}},q:()=>Q("Assume sound speed 340 m/s.","At fixed wave speed, increasing frequency does what to wavelength?","Decreases it",["Increases it","Leaves it unchanged","Makes it zero"],"Key concept: Decreases it. Assume sound speed 340 m/s.")},

];let index=0,values=[],q,locked=false,stats={correct:0,total:0};try{let s=JSON.parse(localStorage.getItem('tc-mcat-sim')||'null');if(s&&Number.isFinite(s.correct)&&Number.isFinite(s.total))stats=s}catch{}function showStats(){$('stats').textContent='Research challenges: '+stats.correct+' / '+stats.total+' correct'}function plot(o){let c=$('plot'),x=c.getContext('2d'),W=c.width,H=c.height,L=72,B=300,R=750,T=35,lo=o.ymin||0,hi=o.ymax||1; x.clearRect(0,0,W,H);x.font='14px system-ui';x.fillStyle='#b9e7e7';x.strokeStyle='#5b8594';for(let i=0;i<=5;i++){let y=B-(B-T)*i/5;x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.fillText(fmt(lo+(hi-lo)*i/5),8,y+4)}x.fillText(o.y||'',L,18);x.fillText(o.x||'',L,H-8);if(o.curves){o.curves.forEach((s,j)=>{x.strokeStyle=['#69f1d2','#f7c66c'][j%2];x.fillStyle=x.strokeStyle;x.fillText(s.name,L+j*180,32);x.beginPath();let started=false;for(let i=0;i<=200;i++){let a=o.max*i/200,b=s.f(a);if(!Number.isFinite(b)){started=false;continue}let X=L+(R-L)*i/200,Y=B-(B-T)*(b-lo)/(hi-lo);if(!started){x.moveTo(X,Y);started=true}else x.lineTo(X,Y)}x.stroke()});x.fillStyle='#b9e7e7';for(let i=0;i<=5;i++)x.fillText(fmt(o.max*i/5),L+(R-L)*i/5-8,B+20)}else if(o.bars){o.bars.forEach(([n,v],i)=>{let X=L+80+i*220,h=(B-T)*v/hi;x.fillStyle='#69d9c3';x.fillRect(X,B-h,100,h);x.fillStyle='#eaffff';x.fillText(n,X,B+20)})}}function update(){let o=mods[index].calc(values);$('result').textContent=o.text;$('plot').hidden=mods[index].n==='CARS reasoning';plot(o)}function challenge(){q=mods[index].q();locked=false;$('passage').textContent=q.p;$('question').textContent=q.t;$('feedback').textContent='';$('choices').replaceChildren();shuffle([q.a,...q.w]).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;stats.total++;if(v===q.a)stats.correct++;$('feedback').textContent=(v===q.a?'Excellent! ':'Review: '+q.a+'. ')+q.e;$('choices').querySelectorAll('button').forEach(a=>{a.disabled=true;if(a.textContent===q.a)a.style.borderColor='#8affc4'});try{localStorage.setItem('tc-mcat-sim',JSON.stringify(stats))}catch{}showStats()};$('choices').append(b)})}function open(i){index=i;let m=mods[i];$('modules').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));$('title').textContent=m.n;$('description').textContent=m.d;$('controls').replaceChildren();values=m.c.map(c=>c.v);m.c.forEach((c,j)=>{let l=document.createElement('label'),t=document.createElement('span'),a=document.createElement(c.options?'select':'input');t.textContent=c.n+': '+c.v;if(c.options)c.options.forEach(v=>a.append(new Option(v,v)));else{a.type='range';a.min=c.min;a.max=c.max;a.step=c.step}a.value=c.v;a.oninput=()=>{values[j]=c.options?a.value:+a.value;t.textContent=c.n+': '+a.value;update()};l.append(t,document.createElement('br'),a);$('controls').append(l)});update();challenge()}mods.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m.n;b.onclick=()=>open(i);$('modules').append(b)});$('challenge').onclick=challenge;$('highlight').onclick=()=>{let s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;let range=s.getRangeAt(0);if(!$('passage').contains(range.commonAncestorContainer))return;try{range.surroundContents(document.createElement('mark'));s.removeAllRanges()}catch{}};$('clearHighlight').onclick=()=>{$('passage').textContent=q.p};showStats();open(0);
