<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tichor</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#142c25;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#103b2c;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:24px;color:#f6d77d}header small{color:#f0d48a}nav{display:flex;gap:7px;flex-wrap:wrap;padding:14px 5%;background:white;border-bottom:1px solid #dce5df}nav button{border:0;background:transparent;padding:11px 15px;border-radius:9px;color:#34564a}nav button.active{background:#dcefe5;color:#176344;font-weight:700}main{max-width:1200px;margin:26px auto;padding:0 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h2{margin:0}button.primary{background:#176344;color:#f8e5a6;border:0;padding:11px 17px;border-radius:9px}button.secondary{background:white;color:#176344;border:1px solid #a7c3b4;padding:10px 14px;border-radius:9px}button.danger{background:#fff0f0;color:#a92b2b;border:1px solid #f1c5c5;padding:8px 11px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:white;border:1px solid #dfe8e1;border-radius:13px;padding:20px;box-shadow:0 3px 12px #103b2c08}.card strong{display:block;font-size:30px;margin-top:8px;color:#176344}.muted{color:#60766c;font-size:13px}.panel{margin-top:20px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e9efeb;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#667b70}td{font-size:14px}td button{margin-right:5px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5f2eb;color:#16613f;font-size:12px}.badge.pending{background:#fff2d9;color:#895600}.badge.overdue{background:#ffe4e4;color:#9b2929}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tools input,.tools select{padding:11px;border:1px solid #cedbd2;border-radius:9px;background:white;min-width:170px}.tools input{flex:1}dialog{border:0;border-radius:16px;max-width:660px;width:calc(100% - 30px);box-shadow:0 25px 90px #122e2466;padding:25px}dialog::backdrop{background:#09281b88}form .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}label.wide{grid-column:1/-1}form input,form select,form textarea{padding:11px;border:1px solid #cad9cf;border-radius:8px;width:100%;background:white;color:#142c25}form textarea{min-height:95px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.empty{padding:36px;text-align:center;color:#6b7e74}.hint{background:#e8f2ec;border:1px solid #cee2d5;border-radius:10px;padding:13px;margin-top:20px;color:#335848;font-size:13px}footer{padding:25px;text-align:center;color:#70877a;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}header{padding:17px}nav{padding:10px}main{margin:18px auto}form .fields{grid-template-columns:1fr}}
header{border-bottom:3px solid #caa447}.card strong{color:#176344}button.primary:hover{background:#103b2c}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #caa447;outline-offset:2px}</style><meta name="theme-color" content="#103b2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tichor"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"></head><body><header><div><h1>◈ Tichor</h1><small>Private communication records workspace</small></div><span id="storage">Local storage</span></header><nav id="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="communications">Communication Log</button><button data-page="contacts">Contacts</button><button data-page="followups">Follow-ups</button><button data-page="exports">Export & Backup</button></nav><main id="app"></main><footer>Tichor v1 · Data stored in this browser only · Back up regularly</footer><dialog id="modal"><h2 id="modalTitle"></h2><form id="recordForm"><div class="fields" id="formFields"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Save record</button></div></form></dialog><script>
'use strict';const KEY='communication-hub-v1';let state={contacts:[],communications:[]},page='dashboard',search='',filter='all';try{let stored=JSON.parse(localStorage.getItem(KEY));if(stored&&Array.isArray(stored.contacts)&&Array.isArray(stored.communications))state=stored}catch(e){alert('Saved records could not be read. No changes were made.')}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Unable to save. Browser storage may be full or disabled. Export a backup.');return false}};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toLocaleDateString('en-CA');const nameOf=id=>state.contacts.find(c=>c.id===id)?.name||'(No contact)';const overdue=c=>c.status!=='Completed'&&c.followup&&c.followup<today();const statusBadge=c=>'<span class="badge '+(overdue(c)?'overdue':c.status==='Completed'?'':'pending')+'">'+(overdue(c)?'Overdue':esc(c.status))+'</span>';const button=(label,action,id,kind='secondary')=>'<button class="'+kind+'" data-action="'+action+'" data-id="'+esc(id)+'">'+label+'</button>';const heading=(title,controls='')=>'<div class="top"><h2>'+title+'</h2><div>'+controls+'</div></div>';const table=(heads,rows)=>'<div class="panel">'+(rows.length?'<table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>':'<div class="empty">No records found. Add your first entry to get started.</div>')+'</div>';function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const open=state.communications.filter(c=>c.status!=='Completed');let html='';if(page==='dashboard'){html=heading('Overview',button('+ New communication','new-communication',''))+'<div class="cards">'+[['Total communications',state.communications.length],['Contacts',state.contacts.length],['Open follow-ups',open.filter(c=>c.followup).length],['Overdue',open.filter(overdue).length]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><h3>Recent communications</h3>'+simpleRows([...state.communications].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7))+'</div><div class="hint">Your information stays in this browser profile. Use Export & Backup regularly; clearing browser data can erase records.</div>'}else if(page==='communications'){let records=state.communications.filter(c=>([c.subject,c.summary,c.channel,c.status,nameOf(c.contactId)].join(' ').toLowerCase().includes(search.toLowerCase()))&&(filter==='all'||c.channel===filter)).sort((a,b)=>b.date.localeCompare(a.date));html=heading('Communication Log',button('+ Add communication','new-communication',''))+'<div class="tools"><input id="search" placeholder="Search names, subjects, notes..." value="'+esc(search)+'"><select id="filter"><option value="all">All channels</option>'+['Phone','Email','WhatsApp','SMS','Meeting','In person','Other'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+table(['Date','Contact','Channel','Subject / Summary','Status','Actions'],records.map(c=>'<tr><td>'+esc(c.date)+'</td><td>'+esc(nameOf(c.contactId))+'</td><td>'+esc(c.channel)+'</td><td><strong>'+esc(c.subject)+'</strong><div class="muted">'+esc(c.summary).slice(0,160)+'</div></td><td>'+statusBadge(c)+'</td><td>'+button('Edit','edit-communication',c.id)+button('Delete','delete-communication',c.id,'danger')+'</td></tr>'))}else if(page==='contacts'){let contacts=state.contacts.filter(c=>[c.name,c.organization,c.email,c.phone].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));html=heading('Contact Directory',button('+ Add contact','new-contact',''))+'<div class="tools"><input id="search" placeholder="Search contacts..." value="'+esc(search)+'"></div>'+table(['Name','Organization / Role','Email','Phone','Actions'],contacts.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong></td><td>'+esc(c.organization)+'<div class="muted">'+esc(c.role)+'</div></td><td>'+esc(c.email)+'</td><td>'+esc(c.phone)+'</td><td>'+button('Edit','edit-contact',c.id)+button('Delete','delete-contact',c.id,'danger')+'</td></tr>'))}else if(page==='followups'){let records=state.communications.filter(c=>c.followup&&c.status!=='Completed').sort((a,b)=>a.followup.localeCompare(b.followup));html=heading('Follow-up Tracker',button('+ Add communication','new-communication',''))+table(['Due date','Contact','Subject','Priority','Status','Actions'],records.map(c=>'<tr><td>'+esc(c.followup)+'</td><td>'+esc(nameOf(c.contactId))+'</td><td>'+esc(c.subject)+'</td><td>'+esc(c.priority)+'</td><td>'+statusBadge(c)+'</td><td>'+button('Complete','complete',c.id)+button('Edit','edit-communication',c.id)+'</td></tr>'))}else{html=heading('Export & Backup')+'<div class="panel"><h3>Download your records</h3><p>Export CSV files for Excel, or a complete JSON backup containing contacts and communications.</p><div class="tools">'+button('Export communications CSV','export-comms','')+button('Export contacts CSV','export-contacts','')+button('Download JSON backup','export-json','')+'</div><h3>Restore a backup</h3><p class="muted">Restoring replaces all records currently in this browser. Download a backup first.</p><input type="file" id="restore" accept=".json,application/json"><div class="hint">This app does not send emails, sync accounts, or provide cloud backups. CSV files may contain sensitive information; store them securely.</div></div>'}$('#app').innerHTML=html;const s=$('#search');if(s){s.addEventListener('input',e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)})}$('#filter')?.addEventListener('change',e=>{filter=e.target.value;render()});$('#restore')?.addEventListener('change',restore)}function simpleRows(arr){return arr.length?'<table><thead><tr><th>Date</th><th>Contact</th><th>Subject</th><th>Status</th></tr></thead><tbody>'+arr.map(c=>'<tr><td>'+esc(c.date)+'</td><td>'+esc(nameOf(c.contactId))+'</td><td>'+esc(c.subject)+'</td><td>'+statusBadge(c)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No communications yet.</div>'}const field=(label,name,type='text',value='',opts=null,wide=false,required=false)=>'<label class="'+(wide?'wide':'')+'">'+label+(opts?'<select name="'+name+'">'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(String(value)===String(o[0])?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'">'+esc(value)+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'>')+'</label>';let editing={type:null,id:null};function openForm(type,id){editing={type,id};let c=(type==='contact'?state.contacts:state.communications).find(x=>x.id===id)||{};$('#modalTitle').textContent=(id?'Edit ':'New ')+(type==='contact'?'contact':'communication');$('#formFields').innerHTML=type==='contact'?[field('Full name','name','text',c.name,null,false,true),field('Organization','organization','text',c.organization),field('Role / position','role','text',c.role),field('Phone','phone','tel',c.phone),field('Email','email','email',c.email),field('Notes','notes','textarea',c.notes,null,true)].join(''):[field('Date','date','date',c.date||today(),null,false,true),field('Contact','contactId','text',c.contactId||'', [['','(No contact)'],...state.contacts.map(x=>[x.id,x.name])]),field('Channel','channel','text',c.channel||'Phone',['Phone','Email','WhatsApp','SMS','Meeting','In person','Other'].map(x=>[x,x])),field('Subject','subject','text',c.subject,null,false,true),field('Discussion summary','summary','textarea',c.summary,null,true),field('Decisions / action items','actions','textarea',c.actions,null,true),field('Follow-up due','followup','date',c.followup),field('Priority','priority','text',c.priority||'Normal',['Low','Normal','High'].map(x=>[x,x])),field('Status','status','text',c.status||'Pending',['Pending','In progress','Completed'].map(x=>[x,x]))].join('');$('#modal').showModal()}$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const collection=editing.type==='contact'?state.contacts:state.communications;const existing=collection.find(x=>x.id===editing.id);if(existing)Object.assign(existing,data);else collection.push({id:uid(),...data});if(save()){$('#modal').close();render()}});$('#cancel').onclick=()=>$('#modal').close();document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='new-contact'||a==='new-communication'||a==='edit-contact'||a==='edit-communication'){openForm(a.includes('contact')?'contact':'communication',id);return}if(a==='complete'){let c=state.communications.find(x=>x.id===id);if(c){c.status='Completed';save();render()}return}if(a.startsWith('delete-')){let type=a.endsWith('contact')?'contacts':'communications';if(!confirm('Permanently delete this record?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render();return}if(a==='export-comms')csv('communications',state.communications);if(a==='export-contacts')csv('contacts',state.contacts);if(a==='export-json')download('tichor-backup-'+today()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2),'application/json')});$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;search='';filter='all';render()}});function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csv(name,records){const keys=name==='contacts'?['name','organization','role','phone','email','notes']:['date','contactId','channel','subject','summary','actions','followup','priority','status'];let lines=[keys.join(','),...records.map(r=>keys.map(k=>'"'+String(k==='contactId'?nameOf(r[k]):r[k]??'').replace(/^[=+@\-\t\r]/,'\'$&').replace(/"/g,'""')+'"').join(','))];download(name+'-'+today()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}async function restore(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.contacts)||!Array.isArray(data.communications)||data.contacts.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string')||data.communications.some(c=>!c||typeof c.id!=='string'||typeof c.subject!=='string'))throw Error('Invalid backup format');if(!confirm('Replace ALL current contacts and communications with this backup?'))return;let previous=state;state={contacts:data.contacts,communications:data.communications};if(!save())state=previous;render()}catch(err){alert('Restore failed: '+err.message)}}render();
</script><script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></body></html>
