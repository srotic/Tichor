<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c2c"><link rel="manifest" href="manifest.webmanifest"><title>Tichor Connect</title><style>:root{font-family:system-ui,Arial;background:#f5f7f3;color:#17392c}*{box-sizing:border-box}body{margin:0}header{background:#103c2c;color:white;padding:20px}header h1{margin:0;color:#e7c46a}header small{color:#d5e1d7}nav{display:flex;gap:5px;overflow:auto;background:#153d30;padding:8px}nav button{border:0;background:transparent;color:white;padding:10px 14px;border-radius:9px;white-space:nowrap}nav button.active{background:#d5ae50;color:#183728;font-weight:700}main{max-width:850px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0001}input,textarea,select{width:100%;padding:12px;border:1px solid #c5d2c9;border-radius:8px;margin:6px 0 12px;font:inherit}button,.action{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:#14543d;color:white;font:inherit;text-decoration:none;display:inline-block;margin:3px}.gold{background:#d2a940;color:#173b2a}.danger{background:#8c3e3e}.muted{color:#64746b;font-size:.9rem}.item{padding:12px 0;border-bottom:1px solid #e7ede8}.item:last-child{border:0}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#e9f0e9;padding:18px;border-radius:10px;font-size:1.5rem;font-weight:700}.metric small{display:block;font-size:.75rem;font-weight:400}label{font-weight:600}h2{margin-top:0}a{color:#14543d}.notice{border-left:4px solid #c8a34c;padding:12px;background:#fff9e7}footer{padding:20px;text-align:center;color:#65766c;font-size:.8rem}</style></head><body><header><h1>Tichor <span style="color:white;font-weight:400">Connect</span></h1><small>Communicate · Document · Organize</small></header><nav id="nav"></nav><main id="app"></main><footer>Local-first prototype · Export backups regularly · Not encrypted</footer><script>
const tabs=['Dashboard','Contacts','Messages','Calls','Email & SMS','Records','Follow-ups','Backup','Live Chat'];let tab='Dashboard',filter='';const key='tichor-connect-v2';let db;try{db=JSON.parse(localStorage.getItem(key))||{contacts:[],messages:[],records:[],tasks:[]}}catch{db={contacts:[],messages:[],records:[],tasks:[]}};function save(){localStorage.setItem(key,JSON.stringify(db))}const el=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function change(t){tab=t;render()}function field(n,p='',type='text'){return `<label>${esc(n)}</label><input name="${esc(n)}" placeholder="${esc(p)}" type="${type}">`}function area(n){return `<label>${esc(n)}</label><textarea name="${esc(n)}" rows="3"></textarea>`}function form(id,inside,button='Save'){return `<form id="${id}" class="panel">${inside}<button class="gold">${button}</button></form>`}function remove(k,id){if(!confirm('Delete this item?'))return;db[k]=db[k].filter(x=>x.id!==id);save();render()}function add(k,obj){db[k].unshift({id:crypto.randomUUID(),created:new Date().toISOString(),...obj});save();render()}function vals(form){return Object.fromEntries(new FormData(form).entries())}function bind(id,fn){document.getElementById(id)?.addEventListener('submit',e=>{e.preventDefault();fn(vals(e.target));e.target.reset()})}function contactSelect(){return `<label>Contact</label><select name="contactId"><option value="">Choose contact</option>${db.contacts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>`}function name(id){return db.contacts.find(c=>c.id===id)?.name||'Unassigned'}function list(k,format){return db[k].filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase())).map(x=>`<div class="item">${format(x)} <button class="danger" onclick="remove('${k}','${x.id}')">Delete</button></div>`).join('')||'<p class="muted">No matching entries.</p>'}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="change('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');let h='';if(tab==='Dashboard'){h=`<h2>Overview</h2><div class="grid">${[['Contacts',db.contacts.length],['Messages',db.messages.length],['Records',db.records.length],['Open follow-ups',db.tasks.filter(x=>!x.done).length]].map(([n,v])=>`<div class="metric">${v}<small>${n}</small></div>`).join('')}</div><div class="panel"><h3>Getting started</h3><p>Add a contact, record an interaction, or draft a message. This version saves information on this device only.</p><p class="notice">Messages are drafts/logs, not delivered to another Tichor user. Voice/video calling requires a real-time backend; SMS and email open your phone's existing apps.</p></div>`}if(tab==='Contacts'){h=`<h2>Contact directory</h2>${form('addcontact',field('name','Full name')+field('phone','Phone number','tel')+field('email','Email','email')+field('organization','Organization'))}<input id="search" placeholder="Search contacts" value="${esc(filter)}"><div class="panel">${list('contacts',c=>`<b>${esc(c.name)}</b><p>${esc(c.organization)}</p><p>${esc(c.phone)} · ${esc(c.email)}</p>${c.phone?`<a class="action" href="tel:${encodeURIComponent(c.phone)}">Call</a><a class="action" href="sms:${encodeURIComponent(c.phone)}">SMS</a>`:''}${c.email?`<a class="action" href="mailto:${encodeURIComponent(c.email)}">Email</a>`:''}`)}</div>`}if(tab==='Messages'){h=`<h2>Messages & drafts</h2><p class="notice">Local message journal only. This does not send or receive Tichor-to-Tichor messages yet.</p>${form('addmessage',contactSelect()+area('message'),'Save message draft')}<input id="search" placeholder="Search messages" value="${esc(filter)}"><div class="panel">${list('messages',m=>`<b>${esc(name(m.contactId))}</b><p>${esc(m.message)}</p><small>${new Date(m.created).toLocaleString()}</small>`)}</div>`}if(tab==='Calls'){h=`<h2>Calls & video</h2><p class="notice">Tap a contact's phone number to start a regular phone call. Video calling inside Tichor is planned, not yet connected.</p><div class="panel">${db.contacts.map(c=>`<div class="item"><b>${esc(c.name)}</b> ${c.phone?`<a class="action" href="tel:${encodeURIComponent(c.phone)}">Phone call</a>`:''}</div>`).join('')||'Add contacts first.'}</div>`}if(tab==='Email & SMS'){h=`<h2>Email & SMS</h2><p class="notice">These buttons open your device's default email or SMS app. They do not automatically capture sent messages.</p><div class="panel">${db.contacts.map(c=>`<div class="item"><b>${esc(c.name)}</b>${c.email?` <a class="action" href="mailto:${encodeURIComponent(c.email)}">Compose email</a>`:''}${c.phone?` <a class="action" href="sms:${encodeURIComponent(c.phone)}">Compose SMS</a>`:''}</div>`).join('')||'Add contacts first.'}</div>`}if(tab==='Records'){h=`<h2>Communication records</h2>${form('addrecord',contactSelect()+`<label>Channel</label><select name="channel"><option>Phone</option><option>Email</option><option>SMS</option><option>Meeting</option><option>WhatsApp</option><option>Other</option></select>`+field('subject','Subject')+area('summary'))}<input id="search" placeholder="Search records" value="${esc(filter)}"><div class="panel">${list('records',r=>`<b>${esc(r.subject)}</b> · ${esc(r.channel)}<p>${esc(name(r.contactId))}</p><p>${esc(r.summary)}</p><small>${new Date(r.created).toLocaleString()}</small>`)}</div>`}if(tab==='Follow-ups'){h=`<h2>Follow-up tracker</h2>${form('addtask',contactSelect()+field('task','Action required')+field('due','','date'))}<input id="search" placeholder="Search follow-ups" value="${esc(filter)}"><div class="panel">${list('tasks',t=>`<b>${esc(t.task)}</b><p>${esc(name(t.contactId))} · Due ${esc(t.due||'unspecified')} · ${t.done?'Completed':'Open'}</p><button onclick="toggleTask('${t.id}')">${t.done?'Reopen':'Mark complete'}</button>`)}</div>`}if(tab==='Live Chat'){h=`<h2>Live Chat</h2><div class="panel"><p>Secure account-based messaging between registered Tichor users. Requires your own Supabase project.</p><p><a href="chat.html" class="action gold">Open Live Chat</a></p></div>`}if(tab==='Backup'){h=`<h2>Backup & export</h2><div class="panel"><p>Download a complete JSON backup, restore it later, or export your records as CSV.</p><button onclick="exportJSON()">Download JSON backup</button><button onclick="exportCSV()">Export records CSV</button><label style="display:block;margin-top:20px">Restore JSON backup (replaces all local records)</label><input type="file" id="restore" accept=".json,application/json"><button onclick="restoreData()">Restore</button></div><p class="notice">Your data is stored only in this browser profile. It is not encrypted or synchronized. Do not use this prototype for sensitive records.</p>`}el.innerHTML=h;document.getElementById('search')?.addEventListener('input',e=>{filter=e.target.value;const p=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(p,p)});bind('addcontact',v=>add('contacts',v));bind('addmessage',v=>add('messages',v));bind('addrecord',v=>add('records',v));bind('addtask',v=>add('tasks',{...v,done:false}))}function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}function download(filename,text,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJSON(){download('tichor-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let cols=['created','channel','subject','summary','contactId'];let csv=[cols.join(','),...db.records.map(r=>cols.map(k=>'"'+String(k==='contactId'?name(r[k]):r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download('tichor-records.csv',csv,'text/csv')}async function restoreData(){let f=document.getElementById('restore').files[0];if(!f)return alert('Choose a JSON file');try{let d=JSON.parse(await f.text());if(!['contacts','messages','records','tasks'].every(k=>Array.isArray(d[k])))throw Error('Invalid format');if(confirm('Replace all current records with this backup?')){db=d;save();render()}}catch(e){alert('Invalid backup: '+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
