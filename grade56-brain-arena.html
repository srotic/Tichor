<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tichor Math Brain Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#174e65,#081525 65%);color:#e8ffff;font:17px system-ui;min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}a{color:#8af9db}header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}h1{font-size:clamp(30px,5vw,55px);text-shadow:0 4px #145b68,0 8px 24px #000;margin:15px 0}button,select,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #60b7bd}button{cursor:pointer;color:#eaffff;background:linear-gradient(#286578,#123344);box-shadow:0 5px #071d2b}button:active{transform:translateY(4px);box-shadow:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid gold}button:disabled{opacity:.65;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;perspective:900px}.tile{min-height:145px;display:grid;place-items:center;text-align:center;transition:transform .2s;transform-style:preserve-3d}.tile:hover{transform:rotateX(7deg) translateY(-4px)}.orb{font-size:42px;filter:drop-shadow(0 8px 5px #0008);transform:translateZ(25px)}section{border:1px solid #4c9ca5;background:linear-gradient(135deg,#194558,#102638);padding:24px;border-radius:22px;margin:22px 0;box-shadow:0 14px 30px #0006}#question{font-size:clamp(24px,4vw,42px);text-align:center;min-height:80px;white-space:pre-line}#choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}#choices button{font-size:24px;min-height:65px}#feedback{min-height:45px;text-align:center;font-weight:bold;color:#ffe49a}#stats{color:#9af8dd}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}select,input{background:#eaffff;color:#123}#next{margin-top:12px}#memory{display:none} @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.tile:hover{transform:none}}
</style><main><header><a href="discovery-lab.html">← Discovery Lab</a><label><input type="checkbox" id="sound" checked> Applause & sound</label><label><input type="checkbox" id="voice"> Voice encouragement</label></header><h1>Math Brain Arena</h1><section><h2>🌌 3D Discovery Worlds</h2><p>Explore rotatable solids, customize your avatar, solve Sudoku, Tangram and Tower of Hanoi.</p><a href="grade56-3d-lab.html">Enter 3D Discovery Worlds →</a></section><p>Grade 5–6 · Explore, think, solve and celebrate.</p><div id="stats" aria-live="polite"></div><section><label>Difficulty <select id="level"><option value="1">Grade 5</option><option value="2">Grade 6</option><option value="3">Advanced</option></select></label><div class="grid" id="games"></div></section><section id="arena"><h2 id="title"></h2><p id="question"></p><div id="choices"></div><form id="memory"><label>Repeat the digits <input id="digits" inputmode="numeric" autocomplete="off"></label><button>Submit</button></form><p id="feedback" role="status"></p><button id="next">Next challenge</button></section></main><canvas id="confetti" aria-hidden="true"></canvas><script>
const $=id=>document.getElementById(id),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)],Q=(t,a,w)=>({t,a,w}),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};let state={xp:0,wins:0,best:0},streak=0,game=0,q,locked=false,token=0,ctx;try{let s=JSON.parse(localStorage.getItem('tc-brain-arena')||'null');if(s&&Number.isFinite(s.xp)&&Number.isFinite(s.wins)&&Number.isFinite(s.best))state=s}catch{}
const games=[
['⚡','Number Ninja',d=>{let a=r(12,40*d),b=r(3,12*d);return Q(a+' × '+b,a*b,'Use partial products.')}],
['🎯','Target 24',d=>{let p=pick([[2,3,4,5,'(5+3−2)×4'],[1,3,4,6,'6÷(1−3÷4)'],[2,2,6,6,'6+6+6+6']].slice(0,2));return Q('Which expression uses '+p.slice(0,4).join(', ')+' exactly once to reach 24?',p[4],'Evaluate parentheses first.')}],
['🏙️','Math Tower',d=>{let a=r(3,12*d),b=r(2,9);return Q('A tower has '+a+' floors with '+b+' rooms each. Total rooms?',a*b,'Multiply floors by rooms.')}],
['🔎','Missing Number',d=>{let a=r(2,12*d),b=r(3,20);return Q(a+' × ? = '+a*b,b,'Divide by '+a+'.')}],
['🍕','Fraction Battle',d=>{let a=r(1,8),b=r(a+1,12);return Q('Which fraction is equivalent to '+a+'/'+b+'?',(a*2)+'/'+(b*2),'Multiply numerator and denominator by 2.')}],
['🚀','Multiplication Master',d=>{let a=r(3,15*d),b=r(3,15);return Q(a*b+' ÷ '+a,b,'Use the inverse multiplication fact.')}],
['🧩','Magic Square',d=>{let k=r(0,8*d);return Q('Complete the magic-square row: '+(8+k)+', ?, '+(6+k)+'; sum '+(15+3*k),1+k,'Subtract the two known values.')}],
['🔺','Number Pyramid',d=>{let a=r(2,20*d),b=r(2,20),c=r(2,20);return Q('Bottom row: '+a+', '+b+', '+c+'. Each upper block adds its two neighbours. Top?',a+2*b+c,'Add '+(a+b)+' and '+(b+c)+'.')}],
['🏗️','Geometry World',d=>{let a=r(2,12*d),b=r(2,10),c=r(2,8);return Q('Volume of a '+a+' × '+b+' × '+c+' cube-shaped rectangular prism?',a*b*c,'Multiply all three dimensions.')}],
['🧭','Treasure Coordinates',d=>{let a=r(1,15*d),b=r(1,9);return Q('Start at ('+a+', 3). Move '+b+' units right. New x?',a+b,'Add the horizontal movement.')}],
['🛒','Supermarket',d=>{let a=r(2,20*d),b=r(1,9);return Q('Pay $'+(a+10)+' for '+b+' items costing $'+a+' total. Change?',10,'Subtract total cost from payment.')}],
['💰','Young Entrepreneur',d=>{let a=r(5,20*d),b=r(2,12);return Q('Revenue $'+(a*b+a)+', expenses $'+a+'. Profit?',a*b,'Revenue minus expenses.')}],
['🌌','Space Mission',d=>{let a=r(3,20*d),b=r(2,9);return Q('Travel '+a+' km per minute for '+b+' minutes. Distance in km?',a*b,'Multiply rate by time.')}],
['🧠','Number Memory',d=>({t:Array.from({length:d+4},()=>r(0,9)).join(''),memory:true})],
['🔮','Pattern Genius',d=>{let a=r(2,8*d),b=r(2,5);return Q([a,a*b,a*b*b].join(', ')+', ?',a*b*b*b,'Multiply by '+b+' each time.')}],
['🔄','Reverse Thinking',d=>{let a=r(3,20*d),b=r(2,9),c=r(1,20);return Q('A number × '+b+' + '+c+' = '+(a*b+c)+'. Find it.',a,'Subtract '+c+', then divide by '+b+'.')}],
['📐','Angle Architect',d=>{let a=r(15,165);return Q('Angles on a straight line total 180°. One is '+a+'°. Other?',180-a,'Subtract from 180.')}],
['🎲','Probability Quest',d=>{let a=r(1,8*d),b=r(1,8);return Q('A bag has '+a+' red and '+b+' blue balls. Total possible individual draws?',a+b,'Add both groups.')}],
['📊','Data Detective',d=>{let a=r(2,20*d),b=r(1,9);return Q('Mean of '+[a,a+b,a+2*b].join(', '),a+b,'Add all values and divide by 3.')}],
['🏆','Championship',d=>{let a=r(3,20*d),b=r(2,12),c=r(1,30);return Q('('+a+' × '+b+') − '+c,a*b-c,'Multiply first, then subtract.')}]
];function stats(){$('stats').textContent='★ '+state.xp+' XP  ·  🏆 '+state.wins+' victories  ·  🔥 '+streak+' streak  ·  Best '+state.best}function celebrate(){if($('sound').checked)try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();for(let i=0;i<12;i++){let b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.09),ctx.sampleRate),a=b.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=(Math.random()*2-1)*Math.exp(-j/(a.length*.15));let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1300+i*70;g.gain.value=.18;s.connect(f).connect(g).connect(ctx.destination);s.start(ctx.currentTime+i*.075)}}catch{}if($('voice').checked&&window.speechSynthesis){let u=new SpeechSynthesisUtterance(pick(['Excellent work!','Amazing!','You did it!']));speechSynthesis.speak(u)}if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:80},()=>({x:r(0,c.width),y:r(-250,0),v:r(3,10),h:r(0,360)})),start=performance.now();function frame(t){x.clearRect(0,0,c.width,c.height);if(t-start>1800)return;p.forEach(o=>{o.y+=o.v;x.fillStyle='hsl('+o.h+' 90% 65%)';x.fillRect(o.x,o.y,8,12)});requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function answer(a){if(locked)return;locked=true;let ok=String(a)===String(q.a);if(ok){state.xp+=100;state.wins++;streak++;state.best=Math.max(streak,state.best);$('feedback').textContent='👏 Outstanding! +100 XP';celebrate()}else{streak=0;$('feedback').textContent='Keep going! Answer: '+q.a+'. '+(q.w||'Try another memory challenge.')}try{localStorage.setItem('tc-brain-arena',JSON.stringify(state))}catch{}stats();$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('memory').style.display='none';$('next').disabled=false}
function next(){let t=++token;locked=false;q=games[game][2](Number($('level').value));$('title').textContent=games[game][0]+' '+games[game][1];$('question').textContent=q.t;$('feedback').textContent='';$('choices').replaceChildren();$('memory').style.display='none';$('next').disabled=true;if(q.memory){q.a=q.t;setTimeout(()=>{if(t!==token)return;$('question').textContent='Repeat the number from memory';$('memory').style.display='block';$('digits').value='';$('digits').focus()},2500);return}let opts=[q.a];if(typeof q.a==='number'){while(opts.length<4){let v=q.a+r(-12,12);if(v>=0&&!opts.includes(v))opts.push(v)}}else if(game===1){opts.push('(2+3)×(4+5)','(6+4)×(3−1)','(1+3)×(6−4)')}else{let [a,b]=q.a.split('/').map(Number);opts.push((a+1)+'/'+b,a+'/'+(b+1),(a+2)+'/'+b)}shuffle(opts).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v);$('choices').append(b)})}
games.forEach((g,i)=>{let b=document.createElement('button');b.className='tile';let s=document.createElement('span');s.className='orb';s.textContent=g[0];b.append(s,document.createTextNode(g[1]));b.onclick=()=>{game=i;next();$('arena').scrollIntoView({block:'start'})};$('games').append(b)});$('next').onclick=next;$('level').onchange=next;$('memory').onsubmit=e=>{e.preventDefault();answer($('digits').value.trim())};stats();next();
</script></html>
