<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Cognitive Academy</title><style>body{margin:auto;max-width:1000px;padding:16px;font:18px system-ui;background:radial-gradient(at top,#375ba0,#101b39);color:white}a{color:#b9f7ff}button,select{font:inherit;padding:12px;border:0;border-radius:12px;background:#e3f2ff;color:#142951;cursor:pointer}button:focus-visible{outline:3px solid gold}section{background:#ffffff14;border:1px solid #ffffff40;border-radius:20px;padding:16px;margin:16px 0}#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}#menu button{font-size:15px}#board{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;perspective:600px}#board button{min-width:58px;font-size:24px;box-shadow:0 5px #7794c8;transform:rotateX(8deg)}#board button:disabled{opacity:.8}#display{font-size:clamp(23px,5vw,38px);text-align:center;white-space:pre-wrap;min-height:70px}#buddy{font-size:60px;text-align:center;filter:drop-shadow(8px 12px 6px #0006)}.celebrate{animation:bounce .7s}@keyframes bounce{50%{transform:translateY(-18px) rotate(10deg)}}@media(prefers-reduced-motion:reduce){.celebrate{animation:none}}#feedback{min-height:50px;color:#ffdc80}#prompt{text-align:center}canvas{width:100%;max-width:500px;display:block;margin:auto}label{display:inline-block;margin:6px}</style><main><a href="discovery-lab.html">← Discovery Lab</a><h1>🧠 Junior Cognitive Academy</h1><p>Memory, attention, reasoning and spatial adventures for ages 5–11.</p><label>Age <select id="age"></select></label><label><input type="checkbox" id="sound" checked> Sound</label><label><input type="checkbox" id="auto" checked> Auto advance</label><button id="pause">Pause</button><section id="menu"></section><section><h2 id="title"></h2><div id="buddy">🤖</div><canvas id="scene" width="500" height="150" hidden></canvas><h3 id="prompt"></h3><div id="display"></div><div id="board"></div><p id="feedback" role="status"></p><button id="repeat">New challenge</button> <button id="listen">🔊 Read instructions</button></section><section><h2>Practice progress</h2><p id="stats"></p><p>Game scores describe practice performance, not IQ or a clinical assessment. Take breaks whenever you need.</p></section></main><script>
const $=x=>document.getElementById(x),rand=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a},pick=a=>a[rand(a.length)],animals=['🐱','🐶','🐸','🦁','🐼','🐰','🐵','🦊'],colors=['🔴','🔵','🟢','🟡'],digits=['1','2','3','4','5','6','7','8','9'],names=['Mia','Leo','Sam','Ava','Noah','Zoe'],arrows=['↑','→','↓','←'];let idx=0,age=5,serial=0,paused=false,locked=false,stats={},streak=0,audio;try{stats=JSON.parse(localStorage.getItem('tc-cognitive')||'{}')}catch{}
for(let i=5;i<=11;i++)$('age').add(new Option(i,i));const length=()=>Math.min(9,2+Math.floor((age-5)/2)+Math.floor(streak/3)),seq=(a,n)=>Array.from({length:n},()=>pick(a));function speak(t){if(!$('sound').checked)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch{}}function tone(n=0){if(!$('sound').checked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=440*2**(n/12);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.26)}catch{}}
function show(t,v=''){$('prompt').textContent=t;$('display').textContent=v;$('board').replaceChildren();speak(t)}function btn(t,f){let b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(!paused&&!locked)f(b)};$('board').append(b);return b}function later(f,ms){let s=serial;setTimeout(()=>{if(s===serial&&!paused)f()},ms)}function done(ok,detail=''){if(locked)return;locked=true;let n=games[idx][0],s=stats[n]||{wins:0,tries:0};s.tries++;if(ok){s.wins++;streak++;tone(7);$('buddy').classList.remove('celebrate');void $('buddy').offsetWidth;$('buddy').classList.add('celebrate')}else streak=0;stats[n]=s;$('feedback').textContent=(ok?'🌟 Wonderful thinking! ':'Good effort! ')+detail;speak($('feedback').textContent);try{localStorage.setItem('tc-cognitive',JSON.stringify(stats))}catch{}report();if($('auto').checked)later(start,ok?2300:4500)}
function choice(t,v,a,opts){show(t,v);shuffle([...new Set([a,...opts])]).forEach(x=>btn(x,()=>done(x===a,x===a?'':'The answer is '+a+'.')))}
function memory(pool,reverse=false,aud=false){let a=seq(pool,length()),target=reverse?a.slice().reverse():a.slice();show('Remember the sequence',aud?'Listen carefully':a.join(' '));if(aud)a.forEach((x,i)=>later(()=>{tone(pool.indexOf(x)*3);$('display').textContent=x},i*850));later(()=>{show(reverse?'Repeat in reverse order':'Repeat in the same order');let i=0;pool.forEach(x=>btn(x,()=>{if(x!==target[i])return done(false,'Sequence: '+target.join(' '));i++;$('display').textContent=target.slice(0,i).join(' ');if(i===target.length)done(true)}))},aud?a.length*850+600:3500+length()*350)}
function missing(){let a=shuffle(animals.slice()).slice(0,Math.min(7,length()+2)),k=rand(a.length);show('Remember these animals',a.join(' '));later(()=>choice('Which animal disappeared?',a.filter((_,i)=>i!==k).join(' '),a[k],animals),4000)}
function pairs(){let n=Math.min(8,length()+1),a=shuffle([...animals.slice(0,n),...animals.slice(0,n)]),open=null,matched=0,busy=false;show('Find matching pairs');a.forEach((x,i)=>btn('?',b=>{if(busy||b.disabled||open===b)return;b.textContent=x;if(!open){open=b;return}let first=open;open=null;if(first.textContent===x){first.disabled=b.disabled=true;matched++;tone(4);if(matched===n)done(true)}else{busy=true;later(()=>{first.textContent=b.textContent='?';busy=false},700)}}))}
function gridRecall(){let n=age<8?3:4,k=rand(n*n);show('Remember the treasure location');for(let i=0;i<n*n;i++)btn(i===k?'💎':'·',()=>{});$('board').style.display='grid';$('board').style.gridTemplateColumns='repeat('+n+',1fr)';later(()=>{show('Where was the treasure?');for(let i=0;i<n*n;i++)btn('·',()=>done(i===k,i===k?'':'It was in square '+(k+1)+'.'))},2500)}
function story(){let n=pick(names),a=pick(animals),p=pick(['park','school','garden']);show('Remember this story',n+' saw '+a+' at the '+p+'.');later(()=>choice('Where did '+n+' see the animal?','',p,['park','school','garden','shop']),4500)}
function association(){let a=shuffle(animals.slice()).slice(0,length()),n=shuffle(names.slice()).slice(0,a.length),k=rand(n.length);show('Remember the names',n.map((x,i)=>x+' '+a[i]).join('  '));later(()=>choice('Which animal belongs to '+n[k]+'?','',a[k],a),5000)}
function odd(){let a=pick(animals),b=pick(animals.filter(x=>x!==a)),n=length()+5,k=rand(n);show('Find the different animal');for(let i=0;i<n;i++)btn(i===k?b:a,()=>done(i===k))}
function rule(){let a=pick(colors),b=pick(colors.filter(x=>x!==a)),same=rand(2)===0;choice(same?'Choose the SAME colour':'Choose a DIFFERENT colour',a,same?a:b,[a,b])}
function stop(){let go=rand(2)===0;choice('Green means GO. Red means STOP.',go?'🟢':'🔴',go?'GO':'STOP',['GO','STOP'])}
function pattern(){let a=seq(colors,age<8?2:3),n=length()+4;choice('What comes next?',Array.from({length:n},(_,i)=>a[i%a.length]).join(' '),a[n%a.length],colors)}
function rotate(){let a=rand(4),n=1+rand(3);choice('Turn the arrow clockwise '+n+' quarter turn'+(n===1?'':'s'),arrows[a],arrows[(a+n)%4],arrows)}
function maze(){let n=age<8?4:5,path=seq(['→','↓'],n-1),x=0,y=0;show('Remember the robot route',path.join(' '));later(()=>{show('Guide the robot using the remembered route');let i=0;['→','↓'].forEach(a=>btn(a,()=>{if(a!==path[i])return done(false,'Route: '+path.join(' '));i++;$('display').textContent=path.slice(0,i).join(' ');if(i===path.length)done(true)}))},4000)}
function hanoi(){let n=Math.min(6,3+Math.floor((age-5)/2)),p=[Array.from({length:n},(_,i)=>n-i),[],[]],sel=-1;function draw(){show('Move the tower to peg 3. Never place a larger disc on a smaller one.');p.forEach((a,i)=>btn('Peg '+(i+1)+' '+(a.join(' · ')||'empty'),()=>{if(sel<0){if(a.length)sel=i;$('feedback').textContent='Choose destination';return}let v=p[sel].at(-1);if(sel!==i&&(!a.length||a.at(-1)>v))a.push(p[sel].pop());sel=-1;if(p[2].length===n)done(true);else draw()}))}draw()}
function sudoku(){let n=4,base=shuffle([1,2,3,4]),g=Array.from({length:16},(_,i)=>base[(Math.floor(i/4)*2+Math.floor(i/8)+i%4)%4]),k=rand(16);choice('Fill the missing Sudoku number',g.map((x,i)=>(i===k?'?':x)+(i%4===3?'\n':'  ')).join(''),String(g[k]),['1','2','3','4'])}
function chess(){let x=rand(6),y=rand(6);choice('Which square can a knight reach from '+String.fromCharCode(97+x)+(y+1)+'?', '♞',String.fromCharCode(99+x)+(y+2),[String.fromCharCode(98+x)+(y+2),String.fromCharCode(99+x)+(y+3),String.fromCharCode(97+x)+(y+2)])}
function tangram(){choice('Two identical right isosceles triangles can join along their longest sides to make which shape?','◢ ◤','Square',['Circle','Pentagon','Hexagon'])}
function traffic(){let n=2+rand(4);choice('A car must move right '+n+' spaces to reach the exit. Which instruction works?','🚗 '+ '▫️'.repeat(n)+' 🏁','Right '+n,['Left '+n,'Right '+(n+1),'Right '+(n-1)])}
function track(){let n=4,k=rand(n);show('Follow the star');let steps=0;function draw(){if(steps++===5){choice('Where did the star finish?','',String(k+1),['1','2','3','4']);return}$('display').textContent=Array.from({length:n},(_,i)=>i===k?'⭐':'·').join('  ');later(()=>{if(steps<5)k=(k+1)%n;draw()},650)}draw()}
function soundDetect(){let n=rand(3);show('Listen to the tone. Which is it?','🔊');tone(n*5);['Low','Middle','High'].forEach((x,i)=>btn(x,()=>done(i===n,'The tone was '+['low','middle','high'][n]+'.')));btn('Replay tone',()=>tone(n*5))}
function architect(){let a=seq(colors,length());show('Remember the building blocks',a.join(' '));later(()=>{show('Rebuild the blocks in order');let i=0;colors.forEach(c=>btn(c,()=>{if(c!==a[i])return done(false,'Pattern: '+a.join(' '));$('display').textContent=a.slice(0,++i).join(' ');if(i===a.length)done(true)}))},4500)}
function cube(){let c=$('scene'),ctx=c.getContext('2d'),s=serial; c.hidden=false;let t=0;function draw(){if(s!==serial||paused)return;ctx.clearRect(0,0,500,150);let a=t/60,pts=[];for(let z of [-1,1])for(let y of [-1,1])for(let x of [-1,1]){let X=x*Math.cos(a)+z*Math.sin(a),Z=-x*Math.sin(a)+z*Math.cos(a),f=100/(4+Z);pts.push([250+X*f,75+y*f,Z])}[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]].map((p,i)=>({p,i,z:p.reduce((a,j)=>a+pts[j][2],0)})).sort((a,b)=>b.z-a.z).forEach(({p,i})=>{ctx.beginPath();p.forEach((j,k)=>k?ctx.lineTo(...pts[j].slice(0,2)):ctx.moveTo(...pts[j].slice(0,2)));ctx.closePath();ctx.fillStyle=['#ffb85b','#57c8e5','#7ce29c','#c69afa','#f7839d','#6899ff'][i];ctx.fill();ctx.stroke()});t++;requestAnimationFrame(draw)}draw();choice('How many faces does this cube have?','','6',['4','8','12'])}
const games=[['Memory Card Safari',pairs],['Simon Memory',()=>memory(colors)],['Missing Object',missing],['Memory Palace',gridRecall],['Number Recall',()=>memory(digits)],['Reverse Number Recall',()=>memory(digits,true)],['Musical Memory',()=>memory(colors,false,true)],['Story Remembering',story],['Face and Name Matching',association],['Treasure Location',gridRecall],['Tower of Hanoi',hanoi],['Sudoku Adventure',sudoku],['Junior Chess',chess],['Tangram Master',tangram],['Traffic Escape',traffic],['Cube Rotation',cube],['Spot the Difference',odd],['Hidden Object',odd],['Red Light Green Light',stop],['Simon Says',()=>memory(arrows)],['Colour Word Challenge',()=>{let a=pick(['Red','Blue','Green','Yellow']),i=rand(4);choice('Choose the colour of the circle, not the word',a+' '+colors[i],['Red','Blue','Green','Yellow'][i],['Red','Blue','Green','Yellow'])}],['Moving Object Tracker',track],['Sound Detective',soundDetect],['Rule Switch',rule],['Find the Odd Object',odd],['Target Recognition',()=>{let a=pick(animals);choice('Find this animal',a,a,animals)}],['Memory Maze',maze],['Treasure Hunt',gridRecall],['Robot Programmer',maze],['Brain Architect',architect],['Junior Detective',story],['Galaxy Memory Mission',()=>memory(['🌍','🪐','🌕','☀️','⭐'])]];
function report(){$('stats').textContent=Object.entries(stats).map(([n,s])=>n+': '+s.wins+'/'+s.tries).join(' · ')||'Choose a game to begin.'}function start(){serial++;locked=false;$('scene').hidden=true;$('board').style.display='flex';$('feedback').textContent='You can do it!';$('title').textContent=games[idx][0];games[idx][1]()}games.forEach((g,i)=>{let b=document.createElement('button');b.textContent=g[0];b.onclick=()=>{idx=i;streak=0;paused=false;$('pause').textContent='Pause';start()};$('menu').append(b)});$('age').onchange=()=>{age=+$('age').value;streak=0;start()};$('repeat').onclick=start;$('listen').onclick=()=>speak($('prompt').textContent);$('pause').onclick=()=>{paused=!paused;serial++;try{speechSynthesis.cancel()}catch{}$('pause').textContent=paused?'Resume':'Pause';if(!paused)start()};report();start();
</script></html>
